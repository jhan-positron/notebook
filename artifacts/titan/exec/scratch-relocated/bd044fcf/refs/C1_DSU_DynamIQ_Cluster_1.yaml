# Top level module name. If not specified then a name will be autogenerated
# based on the number and types of core present.
MODULE: C1_DSU_DynamIQ_Cluster_1

# DebugBlock module name. If not specified then a name will be autogenerated
# based on the top level module name.
MODULE_DEBUG_BLOCK: C1_DSU_DebugBlock_1

# Choose the number of cores in the cluster
# Supports values of 1 to 14
NUM_CORES: 2

# Choose the number of CMEs in the cluster
# Supports values of 0 to 2
NUM_CME: 1

# Enable direct connect to the system interconnect, for cores that support it.
# Supports TRUE or FALSE.
DIRECT_CONNECT: FALSE

# Choose the type of each core. CORE<x>_TYPE where <x> ranges from 0 to NUM_CORES-1
CORE0_TYPE: Nevis  
CORE1_TYPE: Nevis  
CORE2_TYPE: Nevis  
CORE3_TYPE: Nevis  
CORE4_TYPE: Nevis  
CORE5_TYPE: Nevis  
CORE6_TYPE: Nevis  
CORE7_TYPE: Nevis  
CORE8_TYPE: Nevis  
CORE9_TYPE: Nevis  
CORE10_TYPE: Nevis  
CORE11_TYPE: Nevis  
CORE12_TYPE: Nevis  
CORE13_TYPE: Nevis  

# Choose the location for each core/CME. Locations are associated with the number
# of L3 slices and transport topology as follows:
# Topology      Location
# -----------------------
# Single Node   0
# Double Node   0, 1
# Single Ring   0, 1, 2, 3
# Double Ring   0, 1, 2, 3, 4, 5
#
# CORE<x>_LOCATION where <x> ranges from 0 to NUM_CORES-1
#CORE0_LOCATION: 0
#CORE1_LOCATION: 0
#CORE2_LOCATION: 0
#CORE3_LOCATION: 0
#CORE4_LOCATION: 0
#CORE5_LOCATION: 0
#CORE6_LOCATION: 0
#CORE7_LOCATION: 0
#CORE8_LOCATION: 0
#CORE9_LOCATION: 0
#CORE10_LOCATION: 0
#CORE11_LOCATION: 0
#CORE12_LOCATION: 0
#CORE13_LOCATION: 0

# CME<x>_LOCATION where <x> ranges from 0 to NUM_CME-1
#CME0_LOCATION: 0
#CME1_LOCATION: 0

# Include a register slice between a core and the DSU
# Covers signals in SCLK Domain
#
# Supports values of: 0 to 7
# CORE<x>_REG_SLICE where <x> ranges from 0 to NUM_CORES-1
CORE0_REG_SLICE: 0
CORE1_REG_SLICE: 0
CORE2_REG_SLICE: 0
CORE3_REG_SLICE: 0
CORE4_REG_SLICE: 0
CORE5_REG_SLICE: 0
CORE6_REG_SLICE: 0
CORE7_REG_SLICE: 0
CORE8_REG_SLICE: 0
CORE9_REG_SLICE: 0
CORE10_REG_SLICE: 0
CORE11_REG_SLICE: 0
CORE12_REG_SLICE: 0
CORE13_REG_SLICE: 0

# CME<x>_REG_SLICE where <x> ranges from 0 to NUM_CME-1
CME0_REG_SLICE: 0
CME1_REG_SLICE: 0

# Include a register slice between a core and the DSU
# Covers signals in PERIPHCLK Domain
#
# Supports values of: 0 to 7
# CORE<x>_PERIPHCLK_REG_SLICE where <x> ranges from 0 to NUM_CORES-1
CORE0_PERIPHCLK_REG_SLICE: 0
CORE1_PERIPHCLK_REG_SLICE: 0
CORE2_PERIPHCLK_REG_SLICE: 0
CORE3_PERIPHCLK_REG_SLICE: 0
CORE4_PERIPHCLK_REG_SLICE: 0
CORE5_PERIPHCLK_REG_SLICE: 0
CORE6_PERIPHCLK_REG_SLICE: 0
CORE7_PERIPHCLK_REG_SLICE: 0
CORE8_PERIPHCLK_REG_SLICE: 0
CORE9_PERIPHCLK_REG_SLICE: 0
CORE10_PERIPHCLK_REG_SLICE: 0
CORE11_PERIPHCLK_REG_SLICE: 0
CORE12_PERIPHCLK_REG_SLICE: 0
CORE13_PERIPHCLK_REG_SLICE: 0

# CME<x>_PERIPHCLK_REG_SLICE where <x> ranges from 0 to NUM_CME-1
CME0_PERIPHCLK_REG_SLICE: 0
CME1_PERIPHCLK_REG_SLICE: 0

# Include a register slice between a core and the DSU
# Covers signals in ATCLK Domain
#
# Supports values of: 0 to 7
# CORE<x>_ATCLK_REG_SLICE where <x> ranges from 0 to NUM_CORES-1
CORE0_ATCLK_REG_SLICE: 1
CORE1_ATCLK_REG_SLICE: 1
CORE2_ATCLK_REG_SLICE: 0
CORE3_ATCLK_REG_SLICE: 0
CORE4_ATCLK_REG_SLICE: 0
CORE5_ATCLK_REG_SLICE: 0
CORE6_ATCLK_REG_SLICE: 0
CORE7_ATCLK_REG_SLICE: 0
CORE8_ATCLK_REG_SLICE: 0
CORE9_ATCLK_REG_SLICE: 0
CORE10_ATCLK_REG_SLICE: 0
CORE11_ATCLK_REG_SLICE: 0
CORE12_ATCLK_REG_SLICE: 0
CORE13_ATCLK_REG_SLICE: 0

# CME<x>_ATCLK_REG_SLICE where <x> ranges from 0 to NUM_CME-1
CME0_ATCLK_REG_SLICE: 1
CME1_ATCLK_REG_SLICE: 0

# Transport data width
# Supports 256 or 512
TRANSPORT_WIDTH: 256

# Number of register slices in each vertical link of the transport
# Covers all signals in the SCLK domain
# Supports values of 0 to 8
TRANSPORT_VERT_REG_SLICE: 0

# Number of register slices in each horizontal link of the transport
# Covers all signals in the SCLK domain
# Supports values of 0 to 8
TRANSPORT_HORIZ_REG_SLICE: 0

# Number of register slices in each vertical link of the transport
# Covers all signals in the PERIPHCLK domain
# Supports values of 0 to 8
TRANSPORT_PERIPHCLK_VERT_REG_SLICE:  0

# Number of register slices in each horizontal link of the transport
# Covers all signals in the PERIPHCLK domain
# Supports values of 0 to 8
TRANSPORT_PERIPHCLK_HORIZ_REG_SLICE: 0

# Number of register slices in each vertical link of the transport
# Covers all signals in the ATCLK domain
# Supports values of 0 to 8
TRANSPORT_ATCLK_VERT_REG_SLICE:  1

# Number of register slices in each horizontal link of the transport
# Covers all signals in the ATCLK domain
# Supports values of 0 to 8
TRANSPORT_ATCLK_HORIZ_REG_SLICE: 1

# Number of requester ports for the main coherent requester interface
# Supports values of 1, 2, 3, or 4
NUM_REQUESTERS: 1

# Main requester interface is CHI (TRUE) or AXI (FALSE)
CHI: TRUE

# Remove I/O registers from CHI requesters and CHI peripheral ports.
# This reduces the latency to the system, but makes the timing worse on most
# CHI pins. It also removes the SCLKENMx and SCLKENPx pins, so they system must
# drive the interface at full SCLK frequency.
# This setting is typically used when adding a CHI asynchronous bridge in the
# system that will be placed near to the DSU.
UNREGISTERED_CHI_REQUESTERS: FALSE

# Main requester split location (TRUE) or (FALSE)
REQUESTER_SPLIT_LOCATION: FALSE

# Move all pins to a corner node (TRUE) or (FALSE).
# Only valid for 6 node configurations.
# Does not move requester port pins when REQUESTER_SPLIT_LOCATION is TRUE
CORNER_PIN_LOCATION: FALSE

# Enable a register slice on paths going from the transport node to the main
# requester ports (TRUE/FALSE)
REQUESTER_REG_SLICE: FALSE

# Number of ACP interfaces on the cluster
# Supports values of 0, 1, or 2
NUM_ACP: 1

# Width of ACP interfaces data bus in bits
# Supports values of 128 or 256
ACP_WIDTH: 256

# Width of ACP AXI ID in bits
# Supports values of 1 to 24
ACP_ID_WIDTH: 8

# Width of ACP AxUSER signal in bits
# AxUSER is transported from ACP to the CHI requester ports and CHI peripheral
# port and is provided as a sideband signal that is valid if the request came
# from ACP. It is not stored in the L3 cache, so is not valid for L3 evictions.
# Supports values of 0 to 32
ACP_USER_WIDTH: 0

# Enable a register slice on paths going from the transport node to ACP
# (TRUE/FALSE)
ACP_REG_SLICE: FALSE

# Choose the location for each ACP interface.  Locations are associated with the number
# of L3 slices and transport topology as follows:
# Topology      Location
# -----------------------
# Single Node   0
# Double Node   0, 1
# Single Ring   0, 1, 2, 3
# Double Ring   0, 1, 2, 3, 4, 5
#
# These parameters are optional, if not specified then locations will be automatically
# chosen to match the rest of the pins
# ACP<x>_LOCATION where <x> ranges from 0 to NUM_ACP-1
#ACP0_LOCATION: 0
#ACP1_LOCATION: 0

# Number of peripheral port interfaces on the cluster
# Supports values of 0 or 1
NUM_PERIPH_PORT: 1

# Peripheral Port is CHI (TRUE) or AXI (FALSE)
# PERIPH_PORT<x>_CHI where <x> ranges from 0 to NUM_PERIPH_PORT-1
PERIPH_PORT0_CHI: FALSE

# Width of the Peripheral Port interface data bus in bits
# Supports values of 64 or 256
# PERIPH_PORT<x>_WIDTH where <x> ranges from 0 to NUM_PERIPH_PORT-1
PERIPH_PORT0_WIDTH: 64

# Choose the location for each peripheral port interface.  Locations are associated with the number
# of L3 slices and transport topology as follows:
# Topology      Location
# -----------------------
# Single Node   0
# Double Node   0, 1
# Single Ring   0, 1
# Double Ring   0, 1, 5
#
# These parameters are optional, if not specified then locations will be automatically
# chosen to match the rest of the pins
# PERIPH_PORT<x>_LOCATION where <x> ranges from 0 to NUM_PERIPH_PORT-1
#PERIPH_PORT0_LOCATION: 0

# Enable a register slice on paths going from the transport node to the
# peripheral ports (TRUE/FALSE)
PERIPH_PORT_REG_SLICE: FALSE

# The size of the L3 cache.
# Supports values of:
#    0KB
#  256KB
#  512KB
# 1024KB
# 1536KB
#    2MB
#    3MB
#    4MB
#    6MB
#    8MB
#    12MB
#    16MB
#    24MB
#    32MB
L3_CACHE_SIZE: 256KB

# Number of L3 Cache slices
# 1 slice is only suitable for cache sizes of 256KB to 4MB
# 2 slices are only suitable for cache sizes of 512KB to 8MB
# 4 slices are only suitable for cache sizes of 1MB to 16MB
# 8 slices are only suitable for cache sizes of 2MB to 32MB
NUM_L3_SLICES: 1

# Choose the location for each slice.  Locations are associated with the number
# of L3 slices and transport topology as follows:
# Topology      Location
# -----------------------
# Single Node   0
# Double Node   0, 1
# Single Ring   0, 1, 2, 3
# Double Ring   0, 1, 2, 3, 4, 5
#
# These parameters are optional, if not specified then locations will be automatically chosen
# SLICE<x>_LOCATION where <x> ranges from 0 to 5
#SLICE0_LOCATION: 0
#SLICE1_LOCATION: 0
#SLICE2_LOCATION: 0
#SLICE3_LOCATION: 0
#SLICE4_LOCATION: 0
#SLICE5_LOCATION: 0
#SLICE6_LOCATION: 0
#SLICE7_LOCATION: 0

# Number of Long Term Data Buffers per L3 slice.
# Supports values of: 16, 32, 48, 64
NUM_LTDBS: 64

# Protect the L3 cache RAMs and snoop filter RAMs with ECC
SCU_CACHE_PROTECTION: TRUE

# Size (bits) of L3 DataRAM granule protected by SECDED ECC
# Supports values of 128, 256
# This value reflects the size of the L3 cacheline data that is protected by SECDED.
L3_DATA_ECC_GRANULE: 128

# L3 Data RAMs Input Latency
#
# Supports values of:
# 1  : 1 cycle latency
# 2  : 2 cycles latency
# 2p : 2 cycles latency, plus one extra cycle before the next access
L3_DATA_WR_LATENCY: 1

# L3 Data RAMs Output Latency
#
# Supports values of:
# 2 : 2 cycles latency
# 3 : 3 cycles latency
L3_DATA_RD_LATENCY: 2

# L3 Data RAMs output register slice present
L3_DATA_RD_SLICE: FALSE

# L3 Data RAMs clock pulse is stretched
L3_DATA_STRETCH_CLK: TRUE

# Store MPAM ID information in the L3 cache for use on evictions.
# Note this is typically only required if there is a downstream cache with MPAM support.
L3_MPAM_STORAGE: TRUE

# Store 4 bits of PBHA information in the L3 cache
L3_PBHA_STORAGE: FALSE

# Number of Non-Secure MPAM PartIDs
# Supports values of: 8, 64
MPAM_NS_PARTIDS: 8

# The number of synchroniser stages in all asynchronous inputs to the SCU and cluster logic
#
# Supports values of:
# 2 : 2 stage synchronisers
# 3 : 3 stage synchronisers
SYNC_LEVELS: 2

# Include support for cluster level ELA
ELA: FALSE

# The size of the ATB FIFO depth in the cluster ELA
# Supports values of: 4, 8, 16, 32, 64
ELA_ATB_FIFO_DEPTH: 32

# Include asynchronous bridge between the core/CME and the DSU
# CORE<x>_ASYNC_BRIDGE where <x> ranges from 0 to NUM_CORES-1
CORE0_ASYNC_BRIDGE: FALSE
CORE1_ASYNC_BRIDGE: FALSE
CORE2_ASYNC_BRIDGE: TRUE
CORE3_ASYNC_BRIDGE: TRUE
CORE4_ASYNC_BRIDGE: TRUE
CORE5_ASYNC_BRIDGE: TRUE
CORE6_ASYNC_BRIDGE: TRUE
CORE7_ASYNC_BRIDGE: TRUE
CORE8_ASYNC_BRIDGE: TRUE
CORE9_ASYNC_BRIDGE: TRUE
CORE10_ASYNC_BRIDGE: TRUE
CORE11_ASYNC_BRIDGE: TRUE
CORE12_ASYNC_BRIDGE: TRUE
CORE13_ASYNC_BRIDGE: TRUE

# CME<x>_ASYNC_BRIDGE where <x> ranges from 0 to NUM_CME-1
CME0_ASYNC_BRIDGE: FALSE
CME1_ASYNC_BRIDGE: TRUE

# Number of synchroniser stages on core/CME inputs
# CORE<x>_SYNC_LEVELS where <x> ranges from 0 to NUM_CORES-1
#
# Supports values of:
# 2 : 2 stage synchronisers
# 3 : 3 stage synchronisers
CORE0_SYNC_LEVELS: 2
CORE1_SYNC_LEVELS: 2
CORE2_SYNC_LEVELS: 2
CORE3_SYNC_LEVELS: 2
CORE4_SYNC_LEVELS: 2
CORE5_SYNC_LEVELS: 2
CORE6_SYNC_LEVELS: 2
CORE7_SYNC_LEVELS: 2
CORE8_SYNC_LEVELS: 2
CORE9_SYNC_LEVELS: 2
CORE10_SYNC_LEVELS: 2
CORE11_SYNC_LEVELS: 2
CORE12_SYNC_LEVELS: 2
CORE13_SYNC_LEVELS: 2

# CME<x>_SYNC_LEVELS where <x> ranges from 0 to NUM_CME-1
CME0_SYNC_LEVELS: 2
CME1_SYNC_LEVELS: 2

# The width of the ID signals on the Utility Bus
# Supports values of: 1 to 24
UTILITYBUS_ID_WIDTH: 1

# Enable the PPUs to reset into an ON state
# FALSE : PPUs reset to a static OFF mode
# TRUE  : PPUs reset to a dynamic ON mode
PPU_RST_STATE: FALSE

