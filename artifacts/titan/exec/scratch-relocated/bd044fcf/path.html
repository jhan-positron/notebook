</style></head><body><main><figure><svg viewBox="0 0 960 462" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="10.0" y="20.0" width="940.0" height="152.0" rx="3" fill="#f6f8fc" stroke="#b7d3f6"></rect><text x="18.0" y="34.0" font-size="10" text-anchor="start" fill="#52514e" font-weight="600">DSU 1: the cluster of CPUs 2 and 3 (CPU 3 offline during the CME test)</text><rect x="20.0" y="58.0" width="215.0" height="96.0" rx="3" fill="#e9f1fb" stroke="#b7d3f6"></rect><text x="28.0" y="73.0" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="600">1. C1-Nano core, CPU 2</text><text x="28.0" y="88.0" font-size="9.5" text-anchor="start" fill="#52514e">streaming mode (SMSTART) [SOG 2.33]</text><text x="28.0" y="100.0" font-size="9.5" text-anchor="start" fill="#52514e">LD1D decoded here, issued to the CME</text><text x="28.0" y="112.0" font-size="9.5" text-anchor="start" fill="#52514e">3 SME instr. per cycle, loads/stores 2</text><text x="28.0" y="124.0" font-size="9.5" text-anchor="start" fill="#52514e">MMU: x0 (virtual) -> physical address</text><text x="28.0" y="136.0" font-size="9.5" text-anchor="start" fill="#52514e">core L1D 32 KiB, L2 128 KiB: not used</text><rect x="250.0" y="58.0" width="150.0" height="96.0" rx="3" fill="#f1f1ee" stroke="#c3c2b7"></rect><text x="258.0" y="73.0" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="600">2. DSU bridges</text><text x="258.0" y="88.0" font-size="9.5" text-anchor="start" fill="#52514e">CPU and SME2 unit bridges</text><text x="258.0" y="100.0" font-size="9.5" text-anchor="start" fill="#52514e">CMEREQ: the request channel</text><text x="258.0" y="112.0" font-size="9.5" text-anchor="start" fill="#52514e">(LD1D + physical address)</text><text x="258.0" y="124.0" font-size="9.5" text-anchor="start" fill="#52514e">CMETLB: the TLB channel</text><text x="258.0" y="136.0" font-size="9.5" text-anchor="start" fill="#52514e">(prefetcher translations)</text><rect x="415.0" y="58.0" width="270.0" height="96.0" rx="3" fill="#fdeee6" stroke="#e8b9a2"></rect><text x="423.0" y="73.0" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="600">3. CME (C1-SME2 unit)</text><text x="423.0" y="88.0" font-size="9.5" text-anchor="start" fill="#52514e">decode, rename, issue queues</text><text x="423.0" y="100.0" font-size="9.5" text-anchor="start" fill="#52514e">L1D 64 KiB, 4-way, 16 banks, PIPT, 64 B lines</text><text x="423.0" y="112.0" font-size="9.5" text-anchor="start" fill="#52514e">2 x 512-bit read paths: one line fills Z0</text><text x="423.0" y="124.0" font-size="9.5" text-anchor="start" fill="#52514e">prefetcher: 128 streams, own TLB, fills L1D + L3</text><text x="423.0" y="136.0" font-size="9.5" text-anchor="start" fill="#52514e">LASTB: last element of Z0 -> x0, sent to the core</text><rect x="700.0" y="58.0" width="240.0" height="96.0" rx="3" fill="#e9f1fb" stroke="#b7d3f6"></rect><text x="708.0" y="73.0" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="600">4. DSU L3 memory system</text><text x="708.0" y="88.0" font-size="9.5" text-anchor="start" fill="#52514e">SCU + snoop filter (tracks the CME L1D too)</text><text x="708.0" y="100.0" font-size="9.5" text-anchor="start" fill="#52514e">L3 cache 256 KiB</text><text x="708.0" y="112.0" font-size="9.5" text-anchor="start" fill="#52514e">memory interface: CHI, 256-bit wide</text><rect x="300.0" y="210.0" width="180.0" height="80.0" rx="3" fill="#f9f9f7" stroke="#c3c2b7"></rect><text x="308.0" y="225.0" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="600">5. CMN mesh</text><text x="308.0" y="240.0" font-size="9.5" text-anchor="start" fill="#52514e">DSU 1 enters at crosspoint (2,3)</text><text x="308.0" y="252.0" font-size="9.5" text-anchor="start" fill="#52514e">1 to 4 crosspoints to the home</text><text x="308.0" y="264.0" font-size="9.5" text-anchor="start" fill="#52514e">node that owns the address</text><rect x="500.0" y="210.0" width="230.0" height="80.0" rx="3" fill="#fdeee6" stroke="#e8b9a2"></rect><text x="508.0" y="225.0" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="600">6. Home node (HN-S)</text><text x="508.0" y="240.0" font-size="9.5" text-anchor="start" fill="#52514e">one of five; a 1 MiB array of 16 ways:</text><text x="508.0" y="252.0" font-size="9.5" text-anchor="start" fill="#52514e">SLC 768 KiB (12 ways), DRAM lines</text><text x="508.0" y="264.0" font-size="9.5" text-anchor="start" fill="#52514e">OCM 256 KiB (4 ways), 0xE0000000 + n MiB</text><rect x="750.0" y="210.0" width="190.0" height="80.0" rx="3" fill="#f1f1ee" stroke="#c3c2b7"></rect><text x="758.0" y="225.0" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="600">7. DRAM (on an SLC miss)</text><text x="758.0" y="240.0" font-size="9.5" text-anchor="start" fill="#52514e">emulator memory, behind the</text><text x="758.0" y="252.0" font-size="9.5" text-anchor="start" fill="#52514e">SBSX bridge and the</text><text x="758.0" y="264.0" font-size="9.5" text-anchor="start" fill="#52514e">memory controller</text><line x1="235.0" y1="88.0" x2="250.0" y2="88.0" stroke="#2a78d6" stroke-width="2"/><path d="M250.0,88.0 L243.0,91.5 L243.0,84.5 Z" stroke="#2a78d6" stroke-width="1" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round"/><line x1="400.0" y1="88.0" x2="415.0" y2="88.0" stroke="#2a78d6" stroke-width="2"/><path d="M415.0,88.0 L408.0,91.5 L408.0,84.5 Z" stroke="#2a78d6" stroke-width="1" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round"/><text x="325.0" y="50.0" font-size="9" text-anchor="middle" fill="#2a78d6" font-weight="600">LD1D + physical address</text><line x1="415.0" y1="130.0" x2="400.0" y2="130.0" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/><path d="M400.0,130.0 L407.0,126.5 L407.0,133.5 Z" stroke="#eb6834" stroke-width="1" fill="#eb6834" stroke-linejoin="round" stroke-linecap="round"/><line x1="250.0" y1="130.0" x2="235.0" y2="130.0" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/><path d="M235.0,130.0 L242.0,126.5 L242.0,133.5 Z" stroke="#eb6834" stroke-width="1" fill="#eb6834" stroke-linejoin="round" stroke-linecap="round"/><text x="325.0" y="167.0" font-size="9" text-anchor="middle" fill="#eb6834" font-weight="600">x0 back to the core (GPR update)</text><line x1="685.0" y1="102.0" x2="700.0" y2="102.0" stroke="#2a78d6" stroke-width="2"/><path d="M700.0,102.0 L693.0,105.5 L693.0,98.5 Z" stroke="#2a78d6" stroke-width="1" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round"/><text x="692.0" y="50.0" font-size="9" text-anchor="middle" fill="#2a78d6" font-weight="600">L1D miss</text><line x1="700.0" y1="130.0" x2="685.0" y2="130.0" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/><path d="M685.0,130.0 L692.0,126.5 L692.0,133.5 Z" stroke="#eb6834" stroke-width="1" fill="#eb6834" stroke-linejoin="round" stroke-linecap="round"/><text x="740.0" y="167.0" font-size="9" text-anchor="end" fill="#eb6834" font-weight="600">line fill: 0x327D inner, 0x327E outer</text><path d="M760,154 L760,186 L390,186 L390,208" stroke="#2a78d6" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M390.0,210.0 L386.5,203.0 L393.5,203.0 Z" stroke="#2a78d6" stroke-width="1" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round"/><text x="575.0" y="181.0" font-size="9" text-anchor="middle" fill="#2a78d6" font-weight="600">L3 miss: out of the cluster on CHI</text><path d="M440,210 L440,198 L820,198 L820,156" stroke="#eb6834" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/><path d="M820.0,154.0 L823.5,161.0 L816.5,161.0 Z" stroke="#eb6834" stroke-width="1" fill="#eb6834" stroke-linejoin="round" stroke-linecap="round"/><line x1="480.0" y1="240.0" x2="500.0" y2="240.0" stroke="#2a78d6" stroke-width="2"/><path d="M500.0,240.0 L493.0,243.5 L493.0,236.5 Z" stroke="#2a78d6" stroke-width="1" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round"/><line x1="730.0" y1="240.0" x2="750.0" y2="240.0" stroke="#2a78d6" stroke-width="2"/><path d="M750.0,240.0 L743.0,243.5 L743.0,236.5 Z" stroke="#2a78d6" stroke-width="1" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round"/><line x1="500.0" y1="272.0" x2="480.0" y2="272.0" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/><path d="M480.0,272.0 L487.0,268.5 L487.0,275.5 Z" stroke="#eb6834" stroke-width="1" fill="#eb6834" stroke-linejoin="round" stroke-linecap="round"/><line x1="750.0" y1="272.0" x2="730.0" y2="272.0" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/><path d="M730.0,272.0 L737.0,268.5 L737.0,275.5 Z" stroke="#eb6834" stroke-width="1" fill="#eb6834" stroke-linejoin="round" stroke-linecap="round"/><text x="300.0" y="303.0" font-size="9" text-anchor="start" fill="#eb6834" font-weight="600">the line returns the same way: into the L3, then the CME L1D (0x327E outer refill)</text><text x="20.0" y="330.0" font-size="10.5" text-anchor="start" fill="#0b0b0b" font-weight="600">Run 3 measurements along this path (ns per load, best rep, CPU 2):</text><text x="28.0" y="346.0" font-size="10" text-anchor="start" fill="#52514e">Register control, DUP then LASTB: the core-to-CME link both ways, no memory access</text><text x="600.0" y="346.0" font-size="10" text-anchor="start" fill="#eb6834" font-weight="600">21.0 ns (42 CME cycles)</text><text x="28.0" y="359.0" font-size="10" text-anchor="start" fill="#52514e">Chase at 4 KiB, fits the CME L1D (core's own loads at 4 KiB, from its L1)</text><text x="600.0" y="359.0" font-size="10" text-anchor="start" fill="#eb6834" font-weight="600">21.4 ns (core 2.0)</text><text x="28.0" y="372.0" font-size="10" text-anchor="start" fill="#52514e">Chase at 256 KiB, fits the DSU L3 (core at 256 KiB)</text><text x="600.0" y="372.0" font-size="10" text-anchor="start" fill="#eb6834" font-weight="600">53.1 ns (core 19.3)</text><text x="28.0" y="385.0" font-size="10" text-anchor="start" fill="#52514e">Fresh chain of 2 MiB, fits the SLC (core at 2 MiB)</text><text x="600.0" y="385.0" font-size="10" text-anchor="start" fill="#eb6834" font-weight="600">57.6 ns (core 24.1)</text><text x="28.0" y="398.0" font-size="10" text-anchor="start" fill="#52514e">Sparse chase of one OCM region, best of five regions (core, same rows)</text><text x="600.0" y="398.0" font-size="10" text-anchor="start" fill="#eb6834" font-weight="600">35.5 to 38.5 ns (core 21.4 to 25.8)</text><text x="28.0" y="411.0" font-size="10" text-anchor="start" fill="#52514e">8 MiB with every line flushed first, served beyond the SLC (core, same row)</text><text x="600.0" y="411.0" font-size="10" text-anchor="start" fill="#eb6834" font-weight="600">62.6 ns (core 52.7)</text><text x="20.0" y="440.0" font-size="9" text-anchor="start" fill="#898781">Solid blue: the request. Dashed orange: what comes back. Box text from the Arm manuals: C1-Nano SOG 109590 section 2.33, C1-SME2 TRM 107831 chapters 1, 2, 5 and 6, C1-DSU TRM 107804 chapter 2.</text><text x="20.0" y="453.0" font-size="9" text-anchor="start" fill="#898781">Which level served a CME load is not measured: the two refill events count fills by source side of the cluster, not by level (section 5).</text></svg><figcaption><span class="take">Every CME hop crosses the core-to-CME link twice: the address goes out, the result comes back. The register control that does only that reads 21.0 ns; the 4 KiB chase reads 21.4 ns, against 2.0 ns for the core's own L1 load.</span> From 4 KiB to 256 KiB the CME rows climb 31.7 ns and the core's own rows 17.3 ns; from 4 KiB to the flushed 8 MiB row, 41.2 ns against 50.7 ns. The chase minus the control (0.37 ns at 4 KiB) is a derived number: the two rows run different instruction chains, so it is not the L1D hit latency [CME-plan.md section 2.2]. The public LLVM model of the C1-Nano puts a CLASTB result into a GPR at 12 cycles in streaming mode; the measured control is 42 CME cycles per hop, so most of a hop is spent outside that one instruction [refs/C1Nano-streaming-cme-instructions.s].</figcaption></figure></main></body></html>
