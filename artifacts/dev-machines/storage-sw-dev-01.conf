# podman storage for jhan on sw-dev-01.
# Selected with CONTAINERS_STORAGE_CONF (exported by ~/claude-container/claude-box
# and ~/.bashrc when hostname is sw-dev-01). The shared ~/.config/containers/storage.conf
# is alpha's (podman 3.4.4, mount_program=/usr/bin/fuse-overlayfs, which does not exist
# on sw-dev-01). sw-dev-01 has podman 5.8.2, kernel 6.8 and subuid ranges for jhan, so
# native rootless overlay is used (no mount_program).
# graphroot is the admin-provided rootless_storage_path from /etc/containers/storage.conf.
[storage]
driver = "overlay"
graphroot = "/var/lib/podman-rootless/jhan"
