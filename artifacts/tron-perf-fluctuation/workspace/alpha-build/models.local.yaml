# Build overlay for alpha (claude-box): exclude ingest models whose HF repos
# are GATED (401 without a token) and not present in the NFS HF cache.
# No HF token is available on alpha or delphi-3bda (checked 2026-08-09).
# The perf campaigns only need qwen-3-4b / qwen-3-30b-a3b / gpt-oss-20b,
# none of which are affected.
overrides:
  - name: ingested_llama_3p1_8b
    support_level: none
  - name: ingested_llama_3p1_8b_permuted
    support_level: none
  - name: ingested_gemma_3_4b_it
    support_level: none
  - name: ingested_gemma_3_27b_it
    support_level: none
