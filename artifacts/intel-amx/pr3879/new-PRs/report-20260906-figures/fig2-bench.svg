<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" role="img" aria-label="Figure 2. Where bin/slice bench --update runs a test: one run per socket at every width" style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:960px;display:block;background:#fcfcfb">
<text x="20.0" y="20.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">The eight slices of delphi-3bda (a slice = one card, its cores and its hugepages)</text>
<rect x="144" y="34" width="388" height="40" rx="6" fill="#eb6834" fill-opacity="0.12"/>
<rect x="552" y="34" width="388" height="40" rx="6" fill="#2a78d6" fill-opacity="0.12"/>
<text x="150.0" y="30.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">socket 0 = Bill&#x27;s half (cards 10, 13, 38, 3b)</text>
<text x="558.0" y="30.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">socket 1 = our half (cards 90, 93, b9, bc), --instance 1,2</text>
<rect x="150" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="194.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 0</text>
<rect x="246" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="290.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 1</text>
<rect x="342" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="386.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 2</text>
<rect x="438" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="482.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 3</text>
<rect x="558" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="602.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 4</text>
<rect x="654" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="698.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 5</text>
<rect x="750" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="794.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 6</text>
<rect x="846" y="40" width="88" height="28" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="890.0" y="59.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">slice 7</text>
<text x="20.0" y="115.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">width 1 slice</text>
<rect x="150.0" y="100" width="88.0" height="22" rx="3" fill="#eb6834" fill-opacity="0.9" stroke="#fcfcfb" stroke-width="2"><title>width 1 slice: one run under SYSTEM_CONFIG=&quot;--instance 0,8&quot; on slot 0</title></rect>
<text x="244.0" y="115.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">--instance 0,8  (Bill&#x27;s socket)</text>
<rect x="558.0" y="100" width="88.0" height="22" rx="3" fill="#2a78d6" fill-opacity="0.9" stroke="#fcfcfb" stroke-width="2"><title>width 1 slice: one run under SYSTEM_CONFIG=&quot;--instance 4,8&quot; on slot 4</title></rect>
<text x="652.0" y="115.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">--instance 4,8  (our socket)</text>
<text x="20.0" y="155.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">width 2 slices</text>
<rect x="150.0" y="140" width="184.0" height="22" rx="3" fill="#eb6834" fill-opacity="0.9" stroke="#fcfcfb" stroke-width="2"><title>width 2 slices: one run under SYSTEM_CONFIG=&quot;--instance 0,4&quot; on slot 0</title></rect>
<text x="340.0" y="155.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">--instance 0,4  (Bill&#x27;s socket)</text>
<rect x="558.0" y="140" width="184.0" height="22" rx="3" fill="#2a78d6" fill-opacity="0.9" stroke="#fcfcfb" stroke-width="2"><title>width 2 slices: one run under SYSTEM_CONFIG=&quot;--instance 2,4&quot; on slot 4</title></rect>
<text x="748.0" y="155.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">--instance 2,4  (our socket)</text>
<text x="20.0" y="195.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">width 4 slices</text>
<rect x="150.0" y="180" width="376.0" height="22" rx="3" fill="#eb6834" fill-opacity="0.9" stroke="#fcfcfb" stroke-width="2"><title>width 4 slices: one run under SYSTEM_CONFIG=&quot;--instance 0,2&quot; on slot 0</title></rect>
<text x="338.0" y="195.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="normal">--instance 0,2  (Bill&#x27;s socket)</text>
<rect x="558.0" y="180" width="376.0" height="22" rx="3" fill="#2a78d6" fill-opacity="0.9" stroke="#fcfcfb" stroke-width="2"><title>width 4 slices: one run under SYSTEM_CONFIG=&quot;--instance 1,2&quot; on slot 4</title></rect>
<text x="746.0" y="195.0" font-size="10.5" fill="#fcfcfb" text-anchor="middle" font-weight="normal">--instance 1,2  (our socket)</text>
<text x="20.0" y="238.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">Every width launches the test twice at once, once from slot 0 (socket 0) and once from slot 4 (socket 1),</text>
<text x="20.0" y="254.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">under the SYSTEM_CONFIG values shown; the tool picks the slots itself (bin/slice lines 2013-2022 and 2074-2100).</text>
<text x="20.0" y="276.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">So one run of every measurement lands on Bill&#x27;s socket; no option restricts the bench to our half.</text>
<rect x="20" y="295" width="18" height="11" rx="2" fill="#eb6834"/>
<text x="44.0" y="304.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">run on Bill&#x27;s half</text>
<rect x="174.0" y="295" width="18" height="11" rx="2" fill="#2a78d6"/>
<text x="198.0" y="304.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">run on our half</text>
</svg>