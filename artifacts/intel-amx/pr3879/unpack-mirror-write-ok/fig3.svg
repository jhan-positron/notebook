<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="1060" height="480" font-family="system-ui, sans-serif" role="img" aria-label="Concept scopes: a model owns the activation scalar, a registry of attention kernels (geometries) and one attention operation per layer; operations name kernels and bind storage slots; the three AMX gates read different scopes of the same registry">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b5e9e"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5f66"/></marker>
<marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d32"/></marker>
</defs>
<rect width="1060" height="480" fill="#ffffff"/>
<rect x="10" y="8" width="14" height="14" rx="3" fill="#eef4fb" stroke="#1b5e9e" stroke-width="1.5"/>
<text x="30" y="19" font-size="10.5" text-anchor="start" fill="#5b5f66">model-scoped: one per model type</text>
<rect x="231.2" y="8" width="14" height="14" rx="3" fill="#fdf3ea" stroke="#b8621b" stroke-width="1.5"/>
<text x="251.2" y="19" font-size="10.5" text-anchor="start" fill="#5b5f66">layer-scoped: one per layer</text>
<rect x="424.4" y="8" width="14" height="14" rx="3" fill="#f5f4ef" stroke="#5b5f66" stroke-width="1.5"/>
<text x="444.4" y="19" font-size="10.5" text-anchor="start" fill="#5b5f66">storage-scoped: one per KV slot</text>
<rect x="640.0" y="8" width="14" height="14" rx="3" fill="#eef7ee" stroke="#2f7d32" stroke-width="1.5"/>
<text x="660.0" y="19" font-size="10.5" text-anchor="start" fill="#5b5f66">gate: compile-time predicate</text>
<rect x="10" y="34" width="1040" height="436" rx="6" fill="#ffffff" stroke="#1b5e9e" stroke-width="2"/>
<text x="24" y="54" font-size="12.5" text-anchor="start" fill="#14161a" font-weight="600">model = one plugin instantiation, compile time - example: gemma_4_31b_it (60 layers)</text>
<rect x="30" y="68" width="270" height="40" rx="6" fill="#eef4fb" stroke="#1b5e9e" stroke-width="1.5"/>
<text x="165" y="84" font-size="10.5" text-anchor="middle" fill="#14161a">executor fixes activation_scalar (bf16 here)</text>
<text x="165" y="99" font-size="10" text-anchor="middle" fill="#5b5f66">ONE type for the whole model (model.hpp:819)</text>
<rect x="30" y="124" width="270" height="330" rx="6" fill="#fdf3ea" stroke="#b8621b" stroke-width="1.5"/>
<text x="165" y="142" font-size="11.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace" font-weight="600">attention_operations[60]</text>
<text x="165" y="156" font-size="10" text-anchor="middle" fill="#5b5f66">one per LAYER - layer-scoped</text>
<rect x="44" y="168" width="242" height="40" rx="4" fill="#ffffff" stroke="#c9955f" stroke-width="1.2"/>
<text x="165" y="184" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">layer 0:  kernel 0 -&gt; slot 0</text>
<text x="165" y="199" font-size="9.5" text-anchor="middle" fill="#5b5f66">writes_kv, sliding window 1024</text>
<rect x="44" y="214" width="242" height="40" rx="4" fill="#ffffff" stroke="#c9955f" stroke-width="1.2"/>
<text x="165" y="230" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">layer 1:  kernel 0 -&gt; slot 1</text>
<text x="165" y="245" font-size="9.5" text-anchor="middle" fill="#5b5f66">writes_kv, sliding window 1024</text>
<rect x="44" y="260" width="242" height="40" rx="4" fill="#ffffff" stroke="#c9955f" stroke-width="1.2"/>
<text x="165" y="276" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">layers 2..4:  kernel 0 -&gt; slots 2..4</text>
<text x="165" y="291" font-size="9.5" text-anchor="middle" fill="#5b5f66">(same as above)</text>
<rect x="44" y="306" width="242" height="40" rx="4" fill="#ffffff" stroke="#b8621b" stroke-width="1.2"/>
<text x="165" y="322" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">layer 5:  kernel 1 -&gt; slot 5</text>
<text x="165" y="337" font-size="9.5" text-anchor="middle" fill="#5b5f66">writes_kv, global (no window)</text>
<rect x="44" y="352" width="242" height="40" rx="4" fill="#ffffff" stroke="#c9955f" stroke-width="1.2"/>
<text x="165" y="368" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">... the 6-layer pattern repeats x10</text>
<text x="165" y="383" font-size="9.5" text-anchor="middle" fill="#5b5f66">(op i -&gt; layer i -&gt; slot i throughout)</text>
<text x="165" y="412" font-size="10" text-anchor="middle" fill="#5b5f66">an operation = a layer's use of ONE kernel,</text>
<text x="165" y="426" font-size="10" text-anchor="middle" fill="#5b5f66">bound to ONE kv_slot, plus writes_kv and config</text>
<text x="165" y="440" font-size="9.5" text-anchor="middle" fill="#5b5f66">(attention_operation_descriptor, kv_cache.hpp:228)</text>
<rect x="440" y="110" width="250" height="140" rx="6" fill="#eef4fb" stroke="#1b5e9e" stroke-width="1.5"/>
<text x="565" y="128" font-size="11.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace" font-weight="600">attention_kernels[2]</text>
<text x="565" y="142" font-size="10" text-anchor="middle" fill="#5b5f66">model-scoped registry of geometries</text>
<rect x="452" y="152" width="226" height="40" rx="4" fill="#ffffff" stroke="#1b5e9e" stroke-width="1.2"/>
<text x="565" y="168" font-size="10" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">kernel 0: {32 q-heads, kv{16, head 256}}</text>
<text x="565" y="183" font-size="9.5" text-anchor="middle" fill="#5b5f66">ratio = 32/16 = 2</text>
<rect x="452" y="198" width="226" height="40" rx="4" fill="#ffffff" stroke="#1b5e9e" stroke-width="1.2"/>
<text x="565" y="214" font-size="10" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">kernel 1: {32 q-heads, kv{4, head 512}}</text>
<text x="565" y="229" font-size="9.5" text-anchor="middle" fill="#5b5f66">ratio = 32/4 = 8</text>
<rect x="440" y="306" width="250" height="148" rx="6" fill="#f5f4ef" stroke="#5b5f66" stroke-width="1.5"/>
<text x="565" y="324" font-size="11.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace" font-weight="600">cache_t::kv_slot_specs[60]</text>
<text x="565" y="338" font-size="10" text-anchor="middle" fill="#5b5f66">storage slots - the KV half only, no q-heads</text>
<rect x="452" y="348" width="226" height="26" rx="4" fill="#ffffff" stroke="#5b5f66" stroke-width="1.2"/>
<text x="565" y="365" font-size="10" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">slots 0..4, 6..10, ...: kv{16, head 256}</text>
<rect x="452" y="380" width="226" height="26" rx="4" fill="#ffffff" stroke="#5b5f66" stroke-width="1.2"/>
<text x="565" y="397" font-size="10" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">slots 5, 11, ...: kv{4, head 512}</text>
<text x="565" y="422" font-size="9.5" text-anchor="middle" fill="#5b5f66">exactly one writing operation per slot;</text>
<text x="565" y="436" font-size="9.5" text-anchor="middle" fill="#5b5f66">read-only sharers permitted (validator :308)</text>
<path d="M 300 184 L 440 172" stroke="#1b5e9e" stroke-width="1.8" fill="none" marker-end="url(#ab)"/>
<path d="M 300 322 L 440 222" stroke="#1b5e9e" stroke-width="1.8" fill="none" marker-end="url(#ab)"/>
<text x="370" y="158" font-size="9.5" text-anchor="middle" fill="#1b5e9e">names (many -&gt; one)</text>
<path d="M 300 238 L 440 360" stroke="#5b5f66" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<path d="M 300 340 L 440 392" stroke="#5b5f66" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<text x="352" y="420" font-size="9.5" text-anchor="middle" fill="#5b5f66">binds (writes or reads)</text>
<path d="M 480 250 L 480 304" stroke="#5b5f66" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ag)"/>
<text x="590" y="272" font-size="9.5" text-anchor="middle" fill="#5b5f66">kernel KV-half == slot geometry</text>
<text x="590" y="286" font-size="9.5" text-anchor="middle" fill="#5b5f66">(valid_attention_configuration :324-328)</text>
<rect x="830" y="110" width="210" height="100" rx="6" fill="#eef7ee" stroke="#2f7d32" stroke-width="1.5"/>
<text x="935" y="127" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace" font-weight="600">eligible - per operation</text>
<text x="935" y="143" font-size="9.3" text-anchor="middle" fill="#5b5f66">reads: ONE operation's kernel geometry</text>
<text x="935" y="157" font-size="9.3" text-anchor="middle" fill="#5b5f66">(head size AND ratio) + the scalar.</text>
<text x="935" y="171" font-size="9.3" text-anchor="middle" fill="#5b5f66">answers: does THIS layer take the</text>
<text x="935" y="185" font-size="9.3" text-anchor="middle" fill="#5b5f66">AMX path? (self_attention.hpp:1359, 1507)</text>
<rect x="830" y="226" width="210" height="100" rx="6" fill="#eef7ee" stroke="#2f7d32" stroke-width="1.5"/>
<text x="935" y="243" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace" font-weight="600">amx_mirror_eligible - per model</text>
<text x="935" y="259" font-size="9.3" text-anchor="middle" fill="#5b5f66">reads: ALL kernels - true if ANY</text>
<text x="935" y="273" font-size="9.3" text-anchor="middle" fill="#5b5f66">entry passes eligible - + the scalar.</text>
<text x="935" y="287" font-size="9.3" text-anchor="middle" fill="#5b5f66">answers: does every book of this model</text>
<text x="935" y="301" font-size="9.3" text-anchor="middle" fill="#5b5f66">allocate a mirror arena? (kv_cache.hpp:183)</text>
<rect x="830" y="342" width="210" height="100" rx="6" fill="#eef7ee" stroke="#2f7d32" stroke-width="1.5"/>
<text x="935" y="359" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace" font-weight="600">mirror_write_ok - per writing op</text>
<text x="935" y="375" font-size="9.3" text-anchor="middle" fill="#5b5f66">reads: head size + the scalar, NO ratio.</text>
<text x="935" y="389" font-size="9.3" text-anchor="middle" fill="#5b5f66">answers: does save_k fill this slot's</text>
<text x="935" y="403" font-size="9.3" text-anchor="middle" fill="#5b5f66">plane? the ratio question is left to</text>
<text x="935" y="417" font-size="9.3" text-anchor="middle" fill="#5b5f66">each reader (amx_attn_iface.hpp:170)</text>
<path d="M 830 160 L 760 160 L 694 172" stroke="#2f7d32" stroke-width="1.8" fill="none" marker-end="url(#agr)"/>
<path d="M 830 276 L 760 276 L 694 226" stroke="#2f7d32" stroke-width="1.8" fill="none" marker-end="url(#agr)"/>
<path d="M 830 392 L 760 392 L 694 222" stroke="#2f7d32" stroke-width="1.8" fill="none" marker-end="url(#agr)"/>
<text x="762" y="102" font-size="9.5" text-anchor="middle" fill="#2f7d32">what each gate reads in the registry</text>
<text x="762" y="158" font-size="9.5" text-anchor="middle" fill="#2f7d32">one entry (this layer's)</text>
<text x="762" y="270" font-size="9.5" text-anchor="middle" fill="#2f7d32">all entries (ANY)</text>
<text x="762" y="386" font-size="9.5" text-anchor="middle" fill="#2f7d32">one entry, head size only</text>
</svg>