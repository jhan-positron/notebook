<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="system-ui, sans-serif" role="img" aria-label="One KV slot shared by a ratio-8 writer and a ratio-4 read-only consumer: before commit 323b9d5499 the writer's own ratio gated the mirror write and the consumer read a never-written plane; after, the gate is head size and scalar only and the plane is filled">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b5e9e"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5f66"/></marker>
</defs>
<rect width="1060" height="430" fill="#ffffff"/>

<text x="10" y="20" font-size="12.5" font-weight="600" fill="#14161a">Before 323b9d5499: the gate looked at the writer's own ratio</text>
<rect x="10" y="36" width="220" height="118" rx="6" fill="#f5f4ef" stroke="#5b5f66"/>
<text x="120" y="56" font-size="12" font-weight="600" text-anchor="middle" fill="#14161a">writer operation (layer 0)</text>
<text x="120" y="74" font-size="10.5" text-anchor="middle" fill="#5b5f66">8 query heads / 1 KV head / head 128</text>
<text x="120" y="88" font-size="10.5" text-anchor="middle" fill="#5b5f66">ratio 8 = not the AMX shape</text>
<text x="120" y="108" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">writes_kv = true</text>
<text x="120" y="124" font-size="10.5" text-anchor="middle" fill="#14161a">save_k stores each token's K row</text>
<text x="120" y="140" font-size="10.5" text-anchor="middle" fill="#5b5f66">(model.hpp:2792-2800)</text>
<text x="120" y="170" font-size="10.5" text-anchor="middle" fill="#b3261e" font-weight="600">eligible(128, ratio 8) = false</text>
<text x="120" y="184" font-size="10.5" text-anchor="middle" fill="#b3261e">no scatter compiled for this writer</text>
<path d="M 230 76 L 368 64" stroke="#5b5f66" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<text x="300" y="56" font-size="10" text-anchor="middle" fill="#5b5f66">always</text>
<rect x="370" y="36" width="250" height="52" rx="6" fill="#ffffff" stroke="#14161a" stroke-width="1.5"/>
<text x="495" y="56" font-size="11.5" font-weight="600" text-anchor="middle" fill="#14161a">canonical K, kv_slot 0</text>
<text x="495" y="74" font-size="10.5" text-anchor="middle" fill="#5b5f66">DMA page, read by FPGA and AVX dotter</text>
<path d="M 230 116 L 368 130" stroke="#b3261e" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="300" y="114" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="600">no write</text>
<rect x="370" y="102" width="250" height="52" rx="6" fill="#fbeeed" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="495" y="122" font-size="11.5" font-weight="600" text-anchor="middle" fill="#14161a">mirror plane, kv_slot 0</text>
<text x="495" y="140" font-size="10.5" text-anchor="middle" fill="#5b5f66">arena RAM, VNNI layout, AMX only</text>
<path d="M 620 128 L 758 106" stroke="#b3261e" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="689" y="106" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="600">read</text>
<rect x="760" y="36" width="290" height="118" rx="6" fill="#f5f4ef" stroke="#5b5f66"/>
<text x="905" y="56" font-size="12" font-weight="600" text-anchor="middle" fill="#14161a">read-only consumer (layer 1)</text>
<text x="905" y="74" font-size="10.5" text-anchor="middle" fill="#5b5f66">4 query heads / 1 KV head / head 128</text>
<text x="905" y="88" font-size="10.5" text-anchor="middle" fill="#5b5f66">ratio 4 = the AMX shape</text>
<text x="905" y="108" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">writes_kv = false, same kv_slot 0</text>
<text x="905" y="124" font-size="10.5" text-anchor="middle" fill="#14161a">its own ratio passes eligible, so it reads</text>
<text x="905" y="140" font-size="10.5" text-anchor="middle" fill="#5b5f66">the mirror plane (self_attention.hpp:1574)</text>
<text x="905" y="170" font-size="10.5" text-anchor="middle" fill="#b3261e" font-weight="600">reads never-written arena memory</text>
<text x="905" y="184" font-size="10.5" text-anchor="middle" fill="#b3261e">wrong attention scores, no error</text>

<line x1="10" y1="206" x2="1050" y2="206" stroke="#d9d6cf"/>

<text x="10" y="232" font-size="12.5" font-weight="600" fill="#14161a">After: the gate is head size and scalar only (mirror_write_ok)</text>
<rect x="10" y="248" width="220" height="118" rx="6" fill="#f5f4ef" stroke="#5b5f66"/>
<text x="120" y="268" font-size="12" font-weight="600" text-anchor="middle" fill="#14161a">writer operation (layer 0)</text>
<text x="120" y="286" font-size="10.5" text-anchor="middle" fill="#5b5f66">8 query heads / 1 KV head / head 128</text>
<text x="120" y="300" font-size="10.5" text-anchor="middle" fill="#5b5f66">ratio 8 = not the AMX shape</text>
<text x="120" y="320" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">writes_kv = true</text>
<text x="120" y="336" font-size="10.5" text-anchor="middle" fill="#14161a">save_k stores each token's K row</text>
<text x="120" y="352" font-size="10.5" text-anchor="middle" fill="#5b5f66">(model.hpp:2792-2800)</text>
<text x="120" y="382" font-size="10.5" text-anchor="middle" fill="#1b5e9e" font-weight="600">mirror_write_ok&lt;bf16&gt;(128) = true</text>
<text x="120" y="396" font-size="10.5" text-anchor="middle" fill="#1b5e9e">scatter_k_mirror for every stored row</text>
<path d="M 230 288 L 368 276" stroke="#5b5f66" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<text x="300" y="268" font-size="10" text-anchor="middle" fill="#5b5f66">always</text>
<rect x="370" y="248" width="250" height="52" rx="6" fill="#ffffff" stroke="#14161a" stroke-width="1.5"/>
<text x="495" y="268" font-size="11.5" font-weight="600" text-anchor="middle" fill="#14161a">canonical K, kv_slot 0</text>
<text x="495" y="286" font-size="10.5" text-anchor="middle" fill="#5b5f66">DMA page, read by FPGA and AVX dotter</text>
<path d="M 230 328 L 368 342" stroke="#1b5e9e" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<text x="300" y="326" font-size="10" text-anchor="middle" fill="#1b5e9e" font-weight="600">write</text>
<rect x="370" y="314" width="250" height="52" rx="6" fill="#eef4fb" stroke="#1b5e9e" stroke-width="1.5"/>
<text x="495" y="334" font-size="11.5" font-weight="600" text-anchor="middle" fill="#14161a">mirror plane, kv_slot 0</text>
<text x="495" y="352" font-size="10.5" text-anchor="middle" fill="#5b5f66">arena RAM, VNNI layout, AMX only</text>
<path d="M 620 340 L 758 318" stroke="#1b5e9e" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<text x="689" y="318" font-size="10" text-anchor="middle" fill="#1b5e9e" font-weight="600">read</text>
<rect x="760" y="248" width="290" height="118" rx="6" fill="#f5f4ef" stroke="#5b5f66"/>
<text x="905" y="268" font-size="12" font-weight="600" text-anchor="middle" fill="#14161a">read-only consumer (layer 1)</text>
<text x="905" y="286" font-size="10.5" text-anchor="middle" fill="#5b5f66">4 query heads / 1 KV head / head 128</text>
<text x="905" y="300" font-size="10.5" text-anchor="middle" fill="#5b5f66">ratio 4 = the AMX shape</text>
<text x="905" y="320" font-size="10.5" text-anchor="middle" fill="#14161a" font-family="ui-monospace, monospace">writes_kv = false, same kv_slot 0</text>
<text x="905" y="336" font-size="10.5" text-anchor="middle" fill="#14161a">its own ratio passes eligible, so it reads</text>
<text x="905" y="352" font-size="10.5" text-anchor="middle" fill="#5b5f66">the mirror plane (self_attention.hpp:1574)</text>
<text x="905" y="382" font-size="10.5" text-anchor="middle" fill="#1b5e9e" font-weight="600">reads the plane the writer filled</text>
<text x="905" y="396" font-size="10.5" text-anchor="middle" fill="#1b5e9e">same result as the AVX dotter path</text>

</svg>