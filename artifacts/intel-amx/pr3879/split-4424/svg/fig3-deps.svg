<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 262" width="100%" role="img" aria-label="dependency graph of the concerns"><defs><marker id="arrd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b8a84"/></marker></defs><text x="24.0" y="24.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600;" fill="#1b1b1b" >What needs what (an arrow points from a part to the part it needs)</text><rect x="40" y="100" width="520" height="60" rx="8" ry="8" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 4"/><text x="48.0" y="94.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:700;" fill="#2a78d6" >PR-1</text><path d="M221.0,130.0 L189.0,130.0" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><path d="M391.0,130.0 L189.0,130.0" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><path d="M252.8,77.4 L157.2,112.6" stroke="#eb6834" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><path d="M252.8,182.6 L157.2,147.4" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><path d="M621.1,116.2 L378.9,73.8" stroke="#eda100" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><path d="M621.1,143.8 L378.9,186.2" stroke="#eda100" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><path d="M621.0,130.0 L379.0,130.0" stroke="#eda100" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><path d="M621.0,130.0 L549.0,130.0" stroke="#eda100" stroke-width="1.6" marker-end="url(#arrd)" fill="none"/><rect x="35.0" y="114.0" width="150" height="32" rx="5" ry="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="110.0" y="134.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;" fill="#2a78d6" >L layout</text><rect x="225.0" y="114.0" width="150" height="32" rx="5" ry="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="300.0" y="134.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;" fill="#2a78d6" >R AVX-512 reader</text><rect x="395.0" y="114.0" width="150" height="32" rx="5" ry="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="470.0" y="134.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;" fill="#2a78d6" >G FPGA staging</text><rect x="225.0" y="44.0" width="150" height="32" rx="5" ry="5" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><text x="300.0" y="64.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;" fill="#eb6834" >A AMX kernel</text><rect x="225.0" y="184.0" width="150" height="32" rx="5" ry="5" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="300.0" y="204.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;" fill="#1baf7a" >S shared save</text><rect x="625.0" y="114.0" width="150" height="32" rx="5" ry="5" fill="#fcfcfb" stroke="#eda100" stroke-width="2"/><text x="700.0" y="134.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;" fill="#8a5d00" >T tail block + policy</text><text x="24.0" y="232.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;" fill="#52514e" >L ships with R and G in PR-1: without the reader a build with the option on does not compile.</text><text x="24.0" y="248.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;" fill="#52514e" >A and S each need only L, so PR-2 and PR-3 could land in either order. T needs A, S, R