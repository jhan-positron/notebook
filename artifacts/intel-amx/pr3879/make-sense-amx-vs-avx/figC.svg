<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 216" width="960" height="210" font-family="system-ui, sans-serif" role="img" aria-label="One decode token between fences: the forward pass F3 to F1 holds all attention work and all AMX effect; the F1 to F3 logits and listener leg is 5 to 9 percent and untouched"><rect width="960" height="216" fill="#ffffff"/><text x="14" y="20" font-size="13" font-weight="600" fill="#14161a">One decode token, wall-clock lanes (1u / prompt 8192, durations to scale, interleaving schematic)</text><text x="112" y="58" font-size="10.5" fill="#5b5f66" text-anchor="end">scheduler thread</text><text x="112" y="98" font-size="10.5" fill="#5b5f66" text-anchor="end">attn workers (69)</text><text x="112" y="138" font-size="10.5" fill="#5b5f66" text-anchor="end">wcls + listeners</text><rect x="120" y="44" width="682" height="20" rx="3" fill="#f5f4ef" stroke="#5b5f66"/><text x="461" y="58" font-size="10.5" fill="#14161a" text-anchor="middle">plugin run(): 36 layers dispatched, waits on workers_done</text><rect x="802" y="44" width="38" height="20" rx="3" fill="#ffffff" stroke="#5b5f66" stroke-dasharray="5 3"/><rect x="120" y="84" width="682" height="20" rx="3" fill="#f5f4ef" stroke="#5b5f66"/><rect x="341" y="84" width="461" height="20" rx="3" fill="#fbeeed" stroke="#b3261e" stroke-width="1.5"/><text x="571" y="98" font-size="10.5" fill="#b3261e" text-anchor="middle" font-weight="600">attention ~64% of token (est.) - the only part AMX changes</text><text x="230" y="98" font-size="10.5" fill="#14161a" text-anchor="middle">QKV/FFN matmuls, norms</text><rect x="802" y="84" width="38" height="20" rx="3" fill="#ffffff" stroke="#5b5f66" stroke-dasharray="5 3"/><rect x="120" y="124" width="682" height="20" rx="3" fill="#ffffff" stroke="#5b5f66" stroke-dasharray="5 3"/><rect x="802" y="124" width="38" height="20" rx="3" fill="#f5f4ef" stroke="#5b5f66"/><text x="190" y="160" font-size="10" fill="#5b5f66" text-anchor="start">dashed = waiting/idle</text><line x1="120" y1="36" x2="120" y2="150" stroke="#14161a" stroke-width="1.6"/><text x="120" y="176" font-size="11" fill="#14161a" text-anchor="start" font-weight="600">F3 (token N-1)</text><line x1="802" y1="36" x2="802" y2="150" stroke="#14161a" stroke-width="1.6"/><text x="796" y="176" font-size="11" fill="#14161a" text-anchor="end" font-weight="600">F1</text><line x1="840" y1="36" x2="840" y2="150" stroke="#14161a" stroke-width="1.6"/><text x="844" y="176" font-size="11" fill="#14161a" text-anchor="start" font-weight="600">F3 (token N)</text><text x="821" y="160" font-size="10" fill="#14161a" text-anchor="middle">wcls+logits+listeners ~5-9%</text><text x="461" y="196" font-size="10.5" fill="#5b5f66" text-anchor="middle">[F3 -&gt; F1] forward pass - all AMX effect lands here</text><text x="821" y="196" font-size="10.5" fill="#5b5f66" text-anchor="end">[F1 -&gt; F3] untouched by AMX</text></svg>