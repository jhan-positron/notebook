<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 296" width="900" height="296" font-family="system-ui, sans-serif" role="img" aria-label="Per-token period, AMX mirror vs same-binary kill switch, decode-only windows: 3.96 vs 4.01 ms at context 256, 4.66 vs 4.92 at 2048, 7.92 vs 9.06 at 8192"><rect width="900" height="296" fill="#ffffff"/><text x="14" y="22" font-size="13" font-weight="600" fill="#14161a">Per-token period (F3&#8594;F3), mirror vs kill switch - same stamped binary</text><text x="14" y="38" font-size="11" fill="#5b5f66">medians over 765 decode windows per cell (3 runs x 255 tokens); the whole delta sits in the forward-pass phase in every cell</text><text x="160" y="69" font-size="12" fill="#14161a" text-anchor="end" font-weight="600">prompt 256</text><line x1="420" y1="64" x2="423" y2="64" stroke="#d9d6cf" stroke-width="3"/><circle cx="423" cy="64" r="7" fill="#5b5f66" stroke="#fff" stroke-width="2"/><circle cx="420" cy="64" r="7" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="420" y="50" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="600">3.96 ms</text><text x="423" y="88" font-size="11" fill="#5b5f66" text-anchor="middle">4.01 ms</text><text x="441" y="69" font-size="11.5" fill="#14161a" font-weight="600">+1.3% slower without AMX</text><text x="160" y="133" font-size="12" fill="#14161a" text-anchor="end" font-weight="600">prompt 2048</text><line x1="464" y1="128" x2="481" y2="128" stroke="#d9d6cf" stroke-width="3"/><circle cx="481" cy="128" r="7" fill="#5b5f66" stroke="#fff" stroke-width="2"/><circle cx="464" cy="128" r="7" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="464" y="114" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="600">4.66 ms</text><text x="481" y="152" font-size="11" fill="#5b5f66" text-anchor="middle">4.92 ms</text><text x="499" y="133" font-size="11.5" fill="#14161a" font-weight="600">+5.6% slower without AMX</text><text x="160" y="197" font-size="12" fill="#14161a" text-anchor="end" font-weight="600">prompt 8192</text><line x1="670" y1="192" x2="742" y2="192" stroke="#d9d6cf" stroke-width="3"/><circle cx="742" cy="192" r="7" fill="#5b5f66" stroke="#fff" stroke-width="2"/><circle cx="670" cy="192" r="7" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="670" y="178" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="600">7.92 ms</text><text x="742" y="216" font-size="11" fill="#5b5f66" text-anchor="middle">9.06 ms</text><text x="654" y="197" font-size="11.5" fill="#14161a" text-anchor="end" font-weight="600">+14.4% slower without AMX</text><text x="170" y="258" font-size="10" fill="#5b5f66" text-anchor="middle">0 ms</text><text x="296" y="258" font-size="10" fill="#5b5f66" text-anchor="middle">2 ms</text><text x="423" y="258" font-size="10" fill="#5b5f66" text-anchor="middle">4 ms</text><text x="549" y="258" font-size="10" fill="#5b5f66" text-anchor="middle">6 ms</text><text x="675" y="258" font-size="10" fill="#5b5f66" text-anchor="middle">8 ms</text><circle cx="170" cy="278" r="6" fill="#2a78d6"/><text x="182" y="282" font-size="11" fill="#14161a">arena-mirror (AMX on)</text><circle cx="390" cy="278" r="6" fill="#5b5f66"/><text x="402" y="282" font-size="11" fill="#14161a">kill switch (AVX, same binary)</text></svg>