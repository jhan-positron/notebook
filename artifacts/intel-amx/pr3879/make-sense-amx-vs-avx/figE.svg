<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="system-ui, sans-serif" role="img" aria-label="Wall-clock lanes of one measured decode token at context 8192 with stamp numbers 7600 to 7604 on every event and arrows from each stamp label to its point; period 7919 microseconds">
<defs>
<marker id="ptb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b3261e"/></marker>
<marker id="pt5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b5f66"/></marker>
<marker id="pt2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"/></marker>
</defs><rect width="960" height="390" fill="#ffffff"/><text x="14" y="22" font-size="13" text-anchor="start" fill="#14161a" font-weight="600">One decode token, measured (arena-mirror, prompt 8192; medians of 765 decode windows; durations to scale)</text><text x="14" y="38" font-size="11" text-anchor="start" fill="#5b5f66">every event carries its stamp number; a window = the time between two consecutive F3 stamps = one generated token</text><text x="140" y="85" font-size="10.5" text-anchor="end" fill="#5b5f66">scheduler thread</text><text x="140" y="145" font-size="10.5" text-anchor="end" fill="#5b5f66">attention workers (69)</text><text x="140" y="205" font-size="10.5" text-anchor="end" fill="#5b5f66">listener (app-pool)</text><rect x="150.0" y="70" width="680.6" height="22" rx="3" fill="#f5f4ef" stroke="#5b5f66" stroke-width="1.3"/><text x="490" y="85" font-size="10.5" text-anchor="middle" fill="#14161a">run(): dispatches all 36 layers and does its own share of the work - 7504 us</text><rect x="830.6" y="70" width="4.9" height="22" rx="3" fill="#ffffff" stroke="#5b5f66" stroke-width="1.3" stroke-dasharray="5 3"/><text x="827" y="62" font-size="9.5" text-anchor="end" fill="#5b5f66">waits on workers_done: 56 us</text><rect x="835.5" y="70" width="32.7" height="22" rx="3" fill="#f5f4ef" stroke="#5b5f66" stroke-width="1.3"/><text x="852" y="115" font-size="9.5" text-anchor="middle" fill="#5b5f66">wcls + logits + listeners: 361 us</text><rect x="868.2" y="70" width="61.8" height="22" rx="3" fill="#e9e7e0" stroke="#5b5f66" stroke-width="1.3"/><rect x="150.0" y="130" width="14.6" height="22" rx="3" fill="#ffffff" stroke="#5b5f66" stroke-width="1.3" stroke-dasharray="5 3"/><text x="199" y="122" font-size="9.5" text-anchor="start" fill="#b3261e" font-family="ui-monospace, monospace">stamp 7603: workers released, +161 us</text><path d="M 196.6 119.0 L 166.6 131.0" stroke="#b3261e" stroke-width="1.3" fill="none" marker-end="url(#ptb)"/><rect x="164.6" y="130" width="665.1" height="22" rx="3" fill="#fbeeed" stroke="#b3261e" stroke-width="1.3"/><text x="497" y="145" font-size="10.5" text-anchor="middle" fill="#b3261e" font-weight="600">36-layer attention pipeline: 7333 us (stamp 7603 to stamp 7604) - the part AMX accelerates</text><rect x="829.7" y="130" width="38.5" height="22" rx="3" fill="#ffffff" stroke="#5b5f66" stroke-width="1.3" stroke-dasharray="5 3"/><text x="792" y="172" font-size="9.5" text-anchor="end" fill="#5b5f66" font-family="ui-monospace, monospace">stamp 7604: last join; F1 comes 66 us later</text><path d="M 793.7 169.0 L 828.7 154.0" stroke="#5b5f66" stroke-width="1.3" fill="none" marker-end="url(#pt5)"/><rect x="868.2" y="130" width="61.8" height="22" rx="3" fill="#e9e7e0" stroke="#5b5f66" stroke-width="1.3"/><text x="899" y="145" font-size="9.5" text-anchor="middle" fill="#5b5f66">token N+1</text><rect x="150.0" y="190" width="685.5" height="22" rx="3" fill="#ffffff" stroke="#5b5f66" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="835.5" y="190" width="32.7" height="22" rx="3" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.3"/><line x1="867.8" y1="188" x2="867.8" y2="214" stroke="#2a78d6" stroke-width="2"/><text x="829" y="205" font-size="9.5" text-anchor="end" fill="#2a78d6">consumes the token</text><text x="839" y="204" font-size="8.5" text-anchor="start" fill="#2a78d6" font-family="ui-monospace, monospace">7602</text><path d="M 861.5 201.0 L 865.8 201.0" stroke="#2a78d6" stroke-width="1.3" fill="none" marker-end="url(#pt2)"/><rect x="868.2" y="190" width="61.8" height="22" rx="3" fill="#e9e7e0" stroke="#5b5f66" stroke-width="1.3" stroke-dasharray="5 3"/><line x1="150.0" y1="52" x2="150.0" y2="222" stroke="#14161a" stroke-width="1.6"/><text x="154" y="236" font-size="10.5" text-anchor="start" fill="#14161a" font-weight="600">F3 = stamp 7600 (token N-1)</text><line x1="835.5" y1="52" x2="835.5" y2="222" stroke="#14161a" stroke-width="1.6"/><text x="831" y="236" font-size="10.5" text-anchor="end" fill="#14161a" font-weight="600">F1 = stamp 7601</text><line x1="868.2" y1="52" x2="868.2" y2="222" stroke="#14161a" stroke-width="1.6"/><text x="872" y="236" font-size="10.5" text-anchor="start" fill="#14161a" font-weight="600">F3 (7600)</text><text x="493" y="236" font-size="10.5" text-anchor="middle" fill="#5b5f66">[F3 -> F1] forward pass: 7558 us</text><line x1="150.0" y1="252" x2="868.2" y2="252" stroke="#5b5f66" stroke-width="1"/><text x="509" y="266" font-size="10.5" text-anchor="middle" fill="#14161a" font-weight="600">one window: period F3 -> F3 = 7919 us = 126.3 tok/s median</text><path d="M 868 214 L 640 290" stroke="#2a78d6" stroke-width="1" stroke-dasharray="3 3" fill="none"/><rect x="600.0" y="290" width="340.0" height="84" rx="3" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="610" y="306" font-size="10" text-anchor="start" fill="#2a78d6" font-weight="600">magnifier: the last 20 us before F3, enlarged x400</text><line x1="785.0" y1="320" x2="785.0" y2="350" stroke="#2a78d6" stroke-width="2"/><text x="769" y="332" font-size="9.5" text-anchor="end" fill="#2a78d6">stamp 7602: listener submits</text><text x="769" y="344" font-size="9.5" text-anchor="end" fill="#2a78d6">the request for token N+1</text><path d="M 771.0 334.0 L 783.0 334.0" stroke="#2a78d6" stroke-width="1.3" fill="none" marker-end="url(#pt2)"/><line x1="860.0" y1="314" x2="860.0" y2="350" stroke="#14161a" stroke-width="1.6"/><text x="864" y="328" font-size="9.5" text-anchor="start" fill="#14161a" font-weight="600">F3 (7600)</text><path d="M 785.0 358 L 860.0 358" stroke="#b3261e" stroke-width="1.4"/><text x="822" y="369" font-size="9.5" text-anchor="middle" fill="#b3261e">5 us head start (the only cross-token overlap)</text><text x="14" y="306" font-size="10.5" text-anchor="start" fill="#14161a">Reading it: at one user the token is effectively serial.</text><text x="14" y="322" font-size="10.5" text-anchor="start" fill="#14161a">AMX shortens only the red block; the 361 us tail and</text><text x="14" y="338" font-size="10.5" text-anchor="start" fill="#14161a">the 161+66 us edges are fixed costs; the next token</text><text x="14" y="354" font-size="10.5" text-anchor="start" fill="#14161a">gets only a 5 us head start (magnifier).</text></svg>