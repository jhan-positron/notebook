<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 216" width="900" height="216" font-family="system-ui, sans-serif" role="img" aria-label="Attention share of the token grows 14 to 64 percent from context 256 to 8192 (estimate), and the measured share of pages taking the AMX path grows 64 to 98 percent from context 32 to 8192"><rect width="900" height="216" fill="#ffffff"/><text x="14" y="22" font-size="13" font-weight="600" fill="#14161a">Why the boost grows with context</text><text x="14" y="46" font-size="11.5" font-weight="600" fill="#14161a">attention share of the 1u token (est.)</text><text x="112" y="75" font-size="11" fill="#5b5f66" text-anchor="end">prompt 256</text><rect x="120" y="62" width="46" height="18" rx="4" fill="#2a78d6"><title>attention 14%</title></rect><rect x="168" y="62" width="282" height="18" rx="4" fill="#f5f4ef" stroke="#d9d6cf"/><text x="174" y="75" font-size="11" fill="#14161a">14% attention, rest flat</text><text x="112" y="109" font-size="11" fill="#5b5f66" text-anchor="end">prompt 2048</text><rect x="120" y="96" width="99" height="18" rx="4" fill="#2a78d6"><title>attention 30%</title></rect><rect x="221" y="96" width="229" height="18" rx="4" fill="#f5f4ef" stroke="#d9d6cf"/><text x="227" y="109" font-size="11" fill="#14161a">30% attention, rest flat</text><text x="112" y="143" font-size="11" fill="#5b5f66" text-anchor="end">prompt 8192</text><rect x="120" y="130" width="211" height="18" rx="4" fill="#2a78d6"><title>attention 64%</title></rect><rect x="333" y="130" width="117" height="18" rx="4" fill="#f5f4ef" stroke="#d9d6cf"/><text x="339" y="143" font-size="11" fill="#14161a">64% attention, rest flat</text><text x="120" y="176" font-size="10.5" fill="#5b5f66">AMX multiplies only the blue part; its share caps the token boost</text><text x="560" y="46" font-size="11.5" font-weight="600" fill="#14161a">pages taking the AMX path (measured)</text><line x1="560" y1="142" x2="870" y2="142" stroke="#d9d6cf"/><text x="554" y="146" font-size="10" fill="#5b5f66" text-anchor="end">60%</text><line x1="560" y1="102" x2="870" y2="102" stroke="#d9d6cf"/><text x="554" y="106" font-size="10" fill="#5b5f66" text-anchor="end">80%</text><line x1="560" y1="62" x2="870" y2="62" stroke="#d9d6cf"/><text x="554" y="66" font-size="10" fill="#5b5f66" text-anchor="end">100%</text><path d="M 560 133 L 792 78 L 870 66" stroke="#2a78d6" stroke-width="2" fill="none"/><circle cx="560" cy="133" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>prompt 32: 64.4%</title></circle><text x="560" y="123" font-size="11" fill="#14161a" text-anchor="middle" font-weight="600">64.4%</text><text x="560" y="178" font-size="10.5" fill="#5b5f66" text-anchor="middle">32</text><circle cx="792" cy="78" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>prompt 2048: 92.2%</title></circle><text x="792" y="68" font-size="11" fill="#14161a" text-anchor="middle" font-weight="600">92.2%</text><text x="792" y="178" font-size="10.5" fill="#5b5f66" text-anchor="middle">2048</text><circle cx="870" cy="66" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>prompt 8192: 97.8%</title></circle><text x="870" y="56" font-size="11" fill="#14161a" text-anchor="middle" font-weight="600">97.8%</text><text x="870" y="178" font-size="10.5" fill="#5b5f66" text-anchor="end">8192</text><text x="892" y="194" font-size="10.5" fill="#5b5f66" text-anchor="end">x axis: prompt length (tokens)</text><text x="892" y="208" font-size="10.5" fill="#5b5f66" text-anchor="end">tail pages take the dotter; their share shrinks as the prompt grows</text></svg>