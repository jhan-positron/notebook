<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1025" viewBox="0 0 1600 1025" role="img" aria-labelledby="title desc">
  <title id="title">Archer transformer decode pipeline with correct CPU and FPGA placement</title>
  <desc id="desc">The host CPU performs normalization, attention, routing, activations, combining, and sampling. Archer FPGA performs Q, K, V, attention-output, expert feed-forward, and unembedding weight matrix multiplications. Software attention is the current host path; Attention on FPGA is marked only as a future scope.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121e"/>
      <stop offset="1" stop-color="#102033"/>
    </linearGradient>
    <linearGradient id="hostFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17304a"/>
      <stop offset="1" stop-color="#11263a"/>
    </linearGradient>
    <linearGradient id="fpgaFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39265f"/>
      <stop offset="1" stop-color="#251a43"/>
    </linearGradient>
    <linearGradient id="amxFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15473c"/>
      <stop offset="1" stop-color="#10332d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8ca3b8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f0b755"/>
    </marker>
    <style>
      .title{font:750 30px Inter,Segoe UI,sans-serif;fill:#eff7ff}
      .subtitle{font:500 15px Inter,Segoe UI,sans-serif;fill:#9fb4c6}
      .lane{font:800 18px Inter,Segoe UI,sans-serif;letter-spacing:.15em;fill:#8ca4b8}
      .nodeTitle{font:700 16px Inter,Segoe UI,sans-serif;fill:#eef6fc}
      .nodeSmall{font:500 12px Inter,Segoe UI,sans-serif;fill:#aebfcd}
      .micro{font:600 11px Inter,Segoe UI,sans-serif;fill:#a9bdcc}
      .badge{font:800 10px Inter,Segoe UI,sans-serif;letter-spacing:.07em}
      .hostNode{fill:url(#hostFill);stroke:#35536d;stroke-width:1.8}
      .optionalNode{fill:#142638;stroke:#71879a;stroke-width:1.8;stroke-dasharray:7 5}
      .fpgaNode{fill:url(#fpgaFill);stroke:#a77cf5;stroke-width:2}
      .ghostNode{fill:#39265f;fill-opacity:.22;stroke:#c39cff;stroke-width:2.2;stroke-dasharray:9 7}
      .amxNode{fill:url(#amxFill);stroke:#35d6a7;stroke-width:2.4}
      .cacheNode{fill:#18293a;stroke:#f0b755;stroke-width:1.8}
      .flow{fill:none;stroke:#8ca3b8;stroke-width:2.4;marker-end:url(#arrow)}
      .residual{fill:none;stroke:#f0b755;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#arrowGold)}
      .return{fill:none;stroke:#c39cff;stroke-width:2.4;marker-end:url(#arrow)}
      .scopeNow{fill:none;stroke:#35d6a7;stroke-width:2.2;stroke-dasharray:9 7}
      .scopeFuture{fill:none;stroke:#c39cff;stroke-width:2.2;stroke-dasharray:9 7}
      .migration{fill:none;stroke:#c39cff;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1025" fill="url(#bg)"/>
  <text x="58" y="54" class="title">Archer transformer decode · placement-correct blueprint</text>
  <text x="58" y="82" class="subtitle">Solid nodes show today’s functional placement from the supplied pipeline · dashed purple marks future AoF scope only</text>

  <!-- Lane backgrounds -->
  <rect x="45" y="108" width="1510" height="506" rx="22" fill="#0b1926" stroke="#2b4256" stroke-width="2"/>
  <rect x="45" y="638" width="1510" height="307" rx="22" fill="#0b1625" stroke="#4b376e" stroke-width="2"/>
  <text x="70" y="143" class="lane">HOST CPU</text>
  <text x="70" y="676" class="lane" fill="#bba0f3">ARCHER FPGA · WEIGHT MATMULS</text>
  <line x1="45" y1="158" x2="1555" y2="158" stroke="#263d52"/>
  <line x1="45" y1="692" x2="1555" y2="692" stroke="#4b376e"/>

  <!-- Host row 1: token to attention -->
  <g filter="url(#shadow)">
    <rect id="token-index" x="72" y="192" width="132" height="72" rx="14" class="hostNode"/>
    <text x="138" y="220" text-anchor="middle" class="nodeTitle">Token → Index</text>
    <text x="138" y="244" text-anchor="middle" class="nodeSmall">embedding lookup We</text>

    <rect id="pre-attention-rms" x="244" y="192" width="116" height="72" rx="14" class="hostNode"/>
    <text x="302" y="220" text-anchor="middle" class="nodeTitle">RMSNorm</text>
    <text x="302" y="244" text-anchor="middle" class="nodeSmall">normalized X</text>

    <rect id="qk-norm" x="456" y="190" width="82" height="76" rx="14" class="optionalNode"/>
    <text x="497" y="218" text-anchor="middle" class="nodeTitle">QK-Norm</text>
    <text x="497" y="242" text-anchor="middle" class="nodeSmall">optional</text>
    <text x="497" y="258" text-anchor="middle" class="micro">not gpt-oss</text>

    <rect id="rope" x="556" y="190" width="82" height="76" rx="14" class="hostNode"/>
    <text x="597" y="221" text-anchor="middle" class="nodeTitle">RoPE</text>
    <text x="597" y="245" text-anchor="middle" class="nodeSmall">Q / K</text>

    <rect id="kv-cache" x="674" y="184" width="166" height="88" rx="14" class="cacheNode"/>
    <text x="757" y="213" text-anchor="middle" class="nodeTitle">K / V Cache</text>
    <text x="757" y="237" text-anchor="middle" class="nodeSmall">append + page lookup</text>
    <text x="757" y="256" text-anchor="middle" class="micro">host orchestration / DRAM</text>

    <rect id="software-attention" x="884" y="174" width="260" height="108" rx="16" class="amxNode"/>
    <text x="1014" y="205" text-anchor="middle" class="nodeTitle">Software attention · current</text>
    <text x="1014" y="230" text-anchor="middle" class="nodeSmall">QKᵀ=S → mask / sink / optional softcap</text>
    <text x="1014" y="251" text-anchor="middle" class="nodeSmall">stable exp / softmax → EV=O</text>
    <text x="1014" y="271" text-anchor="middle" class="micro">CPU-AMX candidate for QK + PV</text>

    <rect id="attention-output" x="1248" y="192" width="132" height="72" rx="14" class="hostNode"/>
    <text x="1314" y="220" text-anchor="middle" class="nodeTitle">Attn Out</text>
    <text x="1314" y="244" text-anchor="middle" class="nodeSmall">from O·Wo</text>

    <circle id="attention-residual-add" cx="1453" cy="228" r="25" fill="#1c2c3b" stroke="#f0b755" stroke-width="2.4"/>
    <text x="1453" y="236" text-anchor="middle" class="nodeTitle" font-size="25">⊕</text>
  </g>

  <path d="M204 228H244" class="flow"/>
  <path d="M360 228H370V808" fill="none" stroke="#8ca3b8" stroke-width="2.4"/>
  <path d="M451 718V316H478V266" class="return"/>
  <path d="M589 718V316H516V266" class="return"/>
  <path d="M538 228H556" class="flow"/>
  <path d="M638 228H674" class="flow"/>
  <path d="M727 718V302H757V272" class="return"/>
  <path d="M840 228H884" class="flow"/>
  <path d="M1144 228H1175V718" class="flow"/>
  <path d="M1238 718V300H1248V228" class="return"/>
  <path d="M1380 228H1428" class="flow"/>
  <path d="M302 264V304H1453V253" class="residual"/>

  <!-- Current and future attention scope markers -->
  <rect x="866" y="158" width="296" height="140" rx="22" class="scopeNow"/>
  <text x="882" y="168" class="badge" fill="#68e6c1">PLAN A · CURRENT CPU SOFTWARE-ATTENTION SCOPE</text>
  <rect id="gpt-oss-attention-contract" x="872" y="308" width="284" height="48" rx="13" fill="#182435" stroke="#f0b755" stroke-width="1.5"/>
  <text x="1014" y="328" text-anchor="middle" class="badge" fill="#ffd48a">SHARED ATTENTION CONTRACT</text>
  <text x="1014" y="346" text-anchor="middle" class="micro">causal · sliding/full · learned sink/bias</text>

  <!-- Host row 2: MoE / FFN -->
  <g filter="url(#shadow)">
    <rect id="ffn-rms" x="92" y="422" width="116" height="72" rx="14" class="hostNode"/>
    <text x="150" y="450" text-anchor="middle" class="nodeTitle">RMSNorm</text>
    <text x="150" y="474" text-anchor="middle" class="nodeSmall">FFN input NAO</text>

    <rect id="router" x="250" y="414" width="154" height="88" rx="14" class="hostNode"/>
    <text x="327" y="443" text-anchor="middle" class="nodeTitle">Router / Gate</text>
    <text x="327" y="467" text-anchor="middle" class="nodeSmall">expert scores</text>
    <text x="327" y="486" text-anchor="middle" class="micro">routing is host logic</text>

    <rect id="swiglu" x="680" y="414" width="145" height="88" rx="14" class="hostNode"/>
    <text x="752" y="443" text-anchor="middle" class="nodeTitle">SwiGLU</text>
    <text x="752" y="467" text-anchor="middle" class="nodeSmall">FF1 ⊗ act(FF3)</text>
    <text x="752" y="486" text-anchor="middle" class="micro">vector activation</text>

    <rect id="combine" x="1080" y="406" width="208" height="104" rx="14" class="hostNode"/>
    <text x="1184" y="437" text-anchor="middle" class="nodeTitle">top-k / Softmax</text>
    <text x="1184" y="462" text-anchor="middle" class="nodeTitle">+ Expert Combine</text>
    <text x="1184" y="488" text-anchor="middle" class="nodeSmall">routing weights + FF2 outputs</text>

    <circle id="ffn-residual-add" cx="1404" cy="458" r="25" fill="#1c2c3b" stroke="#f0b755" stroke-width="2.4"/>
    <text x="1404" y="466" text-anchor="middle" class="nodeTitle" font-size="25">⊕</text>

    <rect id="next-layer" x="1462" y="422" width="70" height="72" rx="14" class="hostNode"/>
    <text x="1497" y="450" text-anchor="middle" class="nodeTitle">Next</text>
    <text x="1497" y="474" text-anchor="middle" class="nodeSmall">layer</text>
  </g>

  <path d="M1453 253V378H150V422" class="flow"/>
  <path d="M208 458H250" class="flow"/>
  <path d="M404 458H420V930" fill="none" stroke="#8ca3b8" stroke-width="2.4"/>
  <path d="M615 834V540H680V458" class="return"/>
  <path d="M825 458H850V886H886" class="flow"/>
  <path d="M1062 886H1046V540H1080V458" class="return"/>
  <path d="M1288 458H1379" class="flow"/>
  <path d="M150 494V552H1404V483" class="residual"/>
  <path d="M1429 458H1462" class="flow"/>

  <!-- Final-only head path -->
  <g filter="url(#shadow)">
    <rect id="final-rms" x="332" y="548" width="116" height="50" rx="12" class="hostNode"/>
    <text x="390" y="579" text-anchor="middle" class="nodeTitle">Final RMSNorm</text>
    <rect id="logits-softmax" x="1038" y="548" width="158" height="50" rx="12" class="hostNode"/>
    <text x="1117" y="579" text-anchor="middle" class="nodeTitle">Softmax(Logits)</text>
    <rect id="sample" x="1240" y="548" width="112" height="50" rx="12" class="hostNode"/>
    <text x="1296" y="579" text-anchor="middle" class="nodeTitle">Sample</text>
    <rect id="next-token" x="1396" y="548" width="126" height="50" rx="12" class="hostNode"/>
    <text x="1459" y="579" text-anchor="middle" class="nodeTitle">Next Token</text>
  </g>
  <path d="M1497 494V522H390V548" class="flow"/>
  <path d="M448 573H1328V886H1358" class="flow"/>
  <path d="M1494 886H1520V620H1038V573" class="return"/>
  <path d="M1196 573H1240" class="flow"/>
  <path d="M1352 573H1396" class="flow"/>
  <text x="472" y="568" class="micro">after final layer only</text>

  <!-- FPGA row: all weight matrix multiplications -->
  <g filter="url(#shadow)">
    <rect id="fpga-xwq" x="392" y="718" width="118" height="82" rx="14" class="fpgaNode"/>
    <text x="451" y="750" text-anchor="middle" class="nodeTitle">X·Wq</text>
    <text x="451" y="776" text-anchor="middle" class="nodeSmall">→ Q</text>
    <rect id="fpga-xwk" x="530" y="718" width="118" height="82" rx="14" class="fpgaNode"/>
    <text x="589" y="750" text-anchor="middle" class="nodeTitle">X·Wk</text>
    <text x="589" y="776" text-anchor="middle" class="nodeSmall">→ K</text>
    <rect id="fpga-xwv" x="668" y="718" width="118" height="82" rx="14" class="fpgaNode"/>
    <text x="727" y="750" text-anchor="middle" class="nodeTitle">X·Wv</text>
    <text x="727" y="776" text-anchor="middle" class="nodeSmall">→ V</text>
    <rect id="planned-aof" x="830" y="718" width="290" height="82" rx="14" class="ghostNode"/>
    <text x="975" y="746" text-anchor="middle" class="nodeTitle" fill="#d9c7ff">PLANNED · AoF</text>
    <text x="975" y="770" text-anchor="middle" class="nodeSmall">QK · mask / sink · softmax · PV</text>
    <text x="975" y="790" text-anchor="middle" class="micro">future migration · not implemented today</text>
    <rect id="fpga-owo" x="1175" y="718" width="126" height="82" rx="14" class="fpgaNode"/>
    <text x="1238" y="750" text-anchor="middle" class="nodeTitle">O·Wo</text>
    <text x="1238" y="776" text-anchor="middle" class="nodeSmall">→ Attn Out</text>

    <rect id="fpga-wff3" x="438" y="850" width="176" height="72" rx="14" class="fpgaNode"/>
    <text x="526" y="878" text-anchor="middle" class="nodeTitle">NAO·Wff3</text>
    <text x="526" y="902" text-anchor="middle" class="nodeSmall">gate branch</text>
    <rect id="fpga-wff1" x="634" y="850" width="176" height="72" rx="14" class="fpgaNode"/>
    <text x="722" y="878" text-anchor="middle" class="nodeTitle">NAO·Wff1</text>
    <text x="722" y="902" text-anchor="middle" class="nodeSmall">up branch</text>
    <rect id="fpga-wff2" x="886" y="850" width="176" height="72" rx="14" class="fpgaNode"/>
    <text x="974" y="878" text-anchor="middle" class="nodeTitle">FF13·Wff2</text>
    <text x="974" y="902" text-anchor="middle" class="nodeSmall">down branch</text>
    <rect id="fpga-unembed" x="1358" y="850" width="136" height="72" rx="14" class="fpgaNode"/>
    <text x="1426" y="878" text-anchor="middle" class="nodeTitle">We⁻¹</text>
    <text x="1426" y="902" text-anchor="middle" class="nodeSmall">→ logits</text>
  </g>

  <!-- Fan-out / fan-in within FPGA -->
  <path d="M370 808H727" fill="none" stroke="#8ca3b8" stroke-width="2.4"/>
  <path d="M451 808V800" class="flow"/>
  <path d="M589 808V800" class="flow"/>
  <path d="M727 808V800" class="flow"/>
  <path d="M1014 282V690H975V718" class="migration"/>
  <path d="M420 930H722" fill="none" stroke="#8ca3b8" stroke-width="2.4"/>
  <path d="M526 930V922" class="flow"/>
  <path d="M722 930V922" class="flow"/>
  <path d="M526 850V834H615" fill="none" stroke="#c39cff" stroke-width="2.2"/>
  <path d="M722 850V834H615" fill="none" stroke="#c39cff" stroke-width="2.2"/>

  <!-- Legend -->
  <rect x="45" y="965" width="1510" height="40" rx="12" fill="#0d1b29" stroke="#2a4054"/>
  <rect x="70" y="977" width="18" height="16" rx="4" fill="#17304a" stroke="#35536d"/>
  <text x="99" y="990" class="nodeSmall">Host operation / orchestration</text>
  <rect x="354" y="977" width="18" height="16" rx="4" fill="#39265f" stroke="#a77cf5"/>
  <text x="383" y="990" class="nodeSmall">Archer FPGA weight matmul today</text>
  <rect x="685" y="977" width="18" height="16" rx="4" fill="#15473c" stroke="#35d6a7"/>
  <text x="714" y="990" class="nodeSmall">Current CPU-AMX opportunity</text>
  <line x1="993" y1="985" x2="1035" y2="985" class="scopeFuture"/>
  <text x="1048" y="990" class="nodeSmall">Future AoF ownership boundary—not current placement</text>
</svg>
