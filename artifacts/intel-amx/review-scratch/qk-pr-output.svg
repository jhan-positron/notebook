<svg xmlns="http://www.w3.org/2000/svg" class="layout-diagram" viewBox="0 0 1020 300" role="img" aria-labelledby="pr-output-title pr-output-desc">
  <title id="pr-output-title">PR 4424 output: side-by-side tile stores, then four row copies</title>
  <desc id="pr-output-desc">Tiles T0, T1, T2, and T3 store adjacent sixteen-token column blocks into scratch with sixteen head rows and sixty-four token columns. The first four head rows hold real scores. The other twelve rows are padding and are not copied. Four copies of 256 bytes transfer the real rows to the caller's four-head by sixty-four-token score array. No transpose is needed. Row heights are schematic.</desc>
  <defs>
    <pattern id="pr-output-pad" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e9edf1"/><path d="M0 7L7 0" stroke="#b7c1ca" stroke-width="1"/></pattern>
    <marker id="pr-output-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#6f3ba0"/></marker>
  </defs>
  <g font-family="system-ui,sans-serif" fill="#182938">
    <text x="20" y="24" font-size="16" font-weight="700">Scratch: 16 head rows × 64 tokens</text>
    <text x="620" y="24" font-size="16" font-weight="700">Caller: 4 heads × 64 tokens</text>
    <g font-size="12">
      <text x="65" y="60" text-anchor="middle" font-weight="700">T0</text>
      <text x="155" y="60" text-anchor="middle" font-weight="700">T1</text>
      <text x="245" y="60" text-anchor="middle" font-weight="700">T2</text>
      <text x="335" y="60" text-anchor="middle" font-weight="700">T3</text>
      <rect x="20" y="78" width="360" height="160" fill="url(#pr-output-pad)" stroke="#abbac5"/>
      <rect x="20" y="78" width="360" height="40" fill="#00745c"/>
      <path d="M110 78V238M200 78V238M290 78V238" stroke="#fff" stroke-width="2"/>
      <path d="M20 88H380M20 98H380M20 108H380" stroke="#90ceba" stroke-width="1"/>
      <rect x="98" y="150" width="204" height="64" rx="5" fill="#f5f7fa"/>
      <text x="200" y="169" text-anchor="middle">12 padding rows</text>
      <text x="200" y="187" text-anchor="middle">Head rows 4–15</text>
      <text x="200" y="205" text-anchor="middle" font-weight="700">Not copied</text>
      <text x="65" y="259" text-anchor="middle">tokens 0–15</text>
      <text x="155" y="259" text-anchor="middle">16–31</text>
      <text x="245" y="259" text-anchor="middle">32–47</text>
      <text x="335" y="259" text-anchor="middle">48–63</text>
      <text x="438" y="68" font-weight="700" style="fill:#563076">Four row copies</text>
      <path d="M390 98H428L547 157H599" fill="none" stroke="#6f3ba0" stroke-width="3" marker-end="url(#pr-output-arrow)"/>
      <text x="428" y="184">Keep head rows 0–3</text>
      <text x="428" y="204">256 bytes per row</text>
      <text x="428" y="226" font-weight="700" style="fill:#563076">No score transpose</text>
      <rect x="620" y="78" width="376" height="160" fill="#e0f3ed" stroke="#78b49f"/>
      <path d="M714 78V238M808 78V238M902 78V238M620 118H996M620 158H996M620 198H996" stroke="#78b49f"/>
      <text x="637" y="103">head 0</text>
      <text x="637" y="143">head 1</text>
      <text x="637" y="183">head 2</text>
      <text x="637" y="223">head 3</text>
      <text x="667" y="259" text-anchor="middle">tokens 0–15</text>
      <text x="761" y="259" text-anchor="middle">16–31</text>
      <text x="855" y="259" text-anchor="middle">32–47</text>
      <text x="949" y="259" text-anchor="middle">48–63</text>
      <text x="20" y="288" style="fill:#526473">Tile stores use a 256-byte row stride. Caller rows are expanded for readability.</text>
    </g>
  </g>
</svg>
