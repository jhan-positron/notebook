# Developer model registry of the pr5022-optb-20261124 test (passed as -DDEV_MODEL_CONFIG=<this file>).
# It replaces config/models.yaml for the build, so that only the two models under test are compiled.
# Both entries are copies from config/models.yaml at tron commit 187da02163 (head of PR 5022 after the rebase).
# The llama entry keeps one of its nine variants, llama-3.1-8b-instruct-good.
schema_version: 1
models:
  - name: llama_3p1_8b
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    support_level: production
    ingest:
      hf_id: meta-llama/Llama-3.1-8B-Instruct
      source: hand_authored
    variants:
      - slug: llama-3.1-8b-instruct-good
        executors: [perm_tp1, perm_tp2, perm_tp4]
        default_weights: neuralmagic/Meta-Llama-3.1-8B-Instruct-quantized.w4a16
        tags: [production, test]

  - name: "ingested_meta_models_Muse_Glimmer_30B"
    hf_id: "meta-models/Muse-Glimmer-30B"
    support_level: cpp_plugin
    ingest:
      hf_id: meta-models/Muse-Glimmer-30B
      source: generated
      trace_dir: traces/ingested-meta-models-Muse-Glimmer-30B
      required: false
    variants:
      - slug: "ingested-meta-models--Muse-Glimmer-30B"
        executors: [tp1, tp2, tp4]
        default_weights: positron-ai/meta-models--Muse-Glimmer-30B-ingest-best-gptq
        tags: [production, test]
