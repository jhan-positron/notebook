<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" width="1100" height="490" role="img" aria-label="Three lanes: the GitHub merge chain, the 3bda machine queue, and the parallel review work, with the dependencies between them">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
</defs>
<!-- lane backgrounds -->
<rect x="0" y="20" width="1100" height="130" fill="#f6f8fc"/>
<rect x="0" y="190" width="1100" height="130" fill="#fdf5ee"/>
<rect x="0" y="340" width="1100" height="130" fill="#f3f9f4"/>
<text x="12" y="40" font-size="13" font-weight="600" fill="#1f5fbf">GitHub merge chain (serial: each step waits for the one before)</text>
<text x="12" y="210" font-size="13" font-weight="600" fill="#c2601a">delphi-3bda (serial: one campaign at a time, machine busy until tonight)</text>
<text x="12" y="360" font-size="13" font-weight="600" fill="#2a7d4f">In parallel now (needs neither the chain nor the machine)</text>
<!-- lane 1 boxes -->
<g font-size="12.5">
<rect x="20" y="60" width="150" height="62" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<text x="95" y="82" text-anchor="middle" font-weight="600">#5098 draft</text>
<text x="95" y="99" text-anchor="middle">fixes for PR 5047</text>
<text x="95" y="114" text-anchor="middle" fill="#2a7d4f">CI green, Ben takes it</text>
<rect x="210" y="60" width="150" height="62" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<text x="285" y="82" text-anchor="middle" font-weight="600">PR 5047 (Ben)</text>
<text x="285" y="99" text-anchor="middle">into PR 4956's branch</text>
<text x="285" y="114" text-anchor="middle" fill="#c2601a">open, no review yet</text>
<rect x="400" y="60" width="150" height="62" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<text x="475" y="82" text-anchor="middle" font-weight="600">#5086 draft</text>
<text x="475" y="99" text-anchor="middle">into PR 4957's branch</text>
<text x="475" y="114" text-anchor="middle" fill="#2a7d4f">gated, round 1 done</text>
<rect x="590" y="60" width="150" height="62" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<text x="665" y="82" text-anchor="middle" font-weight="600">#5087 draft</text>
<text x="665" y="99" text-anchor="middle">into PR 4958's branch</text>
<text x="665" y="114" text-anchor="middle" fill="#2a7d4f">gated</text>
<rect x="780" y="60" width="150" height="62" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<text x="855" y="82" text-anchor="middle" font-weight="600">#5094 draft</text>
<text x="855" y="99" text-anchor="middle">into PR 4959's branch</text>
<text x="855" y="114" text-anchor="middle" fill="#2a7d4f">gated</text>
<rect x="970" y="60" width="115" height="62" rx="6" fill="#fff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1027" y="82" text-anchor="middle" font-weight="600">stack to main</text>
<text x="1027" y="99" text-anchor="middle">PR 4956 first</text>
<text x="1027" y="114" text-anchor="middle" fill="#8a8f98">later</text>
<line x1="170" y1="91" x2="208" y2="91" stroke="#1f5fbf" stroke-width="2" marker-end="url(#arrb)"/>
<line x1="360" y1="91" x2="398" y2="91" stroke="#1f5fbf" stroke-width="2" marker-end="url(#arrb)"/>
<line x1="550" y1="91" x2="588" y2="91" stroke="#1f5fbf" stroke-width="2" marker-end="url(#arrb)"/>
<line x1="740" y1="91" x2="778" y2="91" stroke="#1f5fbf" stroke-width="2" marker-end="url(#arrb)"/>
<line x1="930" y1="91" x2="968" y2="91" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="189" y="138" text-anchor="middle" font-size="11" fill="#555">build fix first</text>
<text x="569" y="138" text-anchor="middle" font-size="11" fill="#555">diff shrinks to its own 9 files</text>
<text x="759" y="138" text-anchor="middle" font-size="11" fill="#555">then to its own 10 files</text>
</g>
<!-- lane 2 boxes -->
<g font-size="12.5">
<rect x="20" y="230" width="230" height="62" rx="6" fill="#fff" stroke="#c2601a" stroke-width="2"/>
<text x="135" y="252" text-anchor="middle" font-weight="600">i5097 campaign (queued)</text>
<text x="135" y="269" text-anchor="middle">fix vs head vs base, kill switch</text>
<text x="135" y="284" text-anchor="middle" fill="#c2601a">starts 2026-10-22 04:00 UTC</text>
<rect x="300" y="230" width="190" height="62" rx="6" fill="#fff" stroke="#c2601a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="395" y="252" text-anchor="middle" font-weight="600">fix commit to #5098</text>
<text x="395" y="269" text-anchor="middle">only if the campaign</text>
<text x="395" y="284" text-anchor="middle">removes the cost</text>
<rect x="540" y="230" width="300" height="62" rx="6" fill="#fff" stroke="#c2601a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="690" y="252" text-anchor="middle" font-weight="600">performance at the three draft heads</text>
<text x="690" y="269" text-anchor="middle">cells in each body's Pending measurement</text>
<text x="690" y="284" text-anchor="middle" fill="#8a8f98">not scheduled, after review rounds settle</text>
<rect x="890" y="230" width="190" height="62" rx="6" fill="#fff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="985" y="252" text-anchor="middle" font-weight="600">#5098 gate on 3bda</text>
<text x="985" y="269" text-anchor="middle">optional, CI covers it</text>
<text x="985" y="284" text-anchor="middle" fill="#8a8f98">any free slot</text>
<line x1="250" y1="261" x2="298" y2="261" stroke="#c2601a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="490" y1="261" x2="538" y2="261" stroke="#c2601a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="840" y1="261" x2="888" y2="261" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- cross-lane: the fix commit feeds #5098, routed through the gap between the lanes -->
<path d="M395,230 L395,170 L95,170 L95,124" fill="none" stroke="#c2601a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<text x="245" y="164" text-anchor="middle" font-size="11" fill="#c2601a">pushes two commits onto #5098, before Ben takes it or as a follow-up</text>
</g>
<!-- lane 3 boxes -->
<g font-size="12.5">
<rect x="20" y="380" width="230" height="62" rx="6" fill="#fff" stroke="#2a7d4f" stroke-width="2"/>
<text x="135" y="402" text-anchor="middle" font-weight="600">review #5086 #5087 #5094</text>
<text x="135" y="419" text-anchor="middle">each on its own scope</text>
<text x="135" y="434" text-anchor="middle" fill="#2a7d4f">jhan and Ben, now</text>
<rect x="280" y="380" width="250" height="62" rx="6" fill="#fff" stroke="#2a7d4f" stroke-width="2"/>
<text x="405" y="402" text-anchor="middle" font-weight="600">PR 5047 decisions</text>
<text x="405" y="419" text-anchor="middle">merge order, staging copy, items 3 to 9</text>
<text x="405" y="434" text-anchor="middle" fill="#2a7d4f">answered on Ben-PR4956.html</text>
<rect x="560" y="380" width="230" height="62" rx="6" fill="#fff" stroke="#2a7d4f" stroke-width="2"/>
<text x="675" y="402" text-anchor="middle" font-weight="600">issue #5097 record</text>
<text x="675" y="419" text-anchor="middle">root cause posted, fix drafted</text>
<text x="675" y="434" text-anchor="middle" fill="#c2601a">waits for the campaign</text>
<rect x="820" y="380" width="250" height="62" rx="6" fill="#fff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="945" y="402" text-anchor="middle" font-weight="600">PR 4956 body rewrite</text>
<text x="945" y="419" text-anchor="middle">new names after PR 5047 merges</text>
<text x="945" y="434" text-anchor="middle" fill="#8a8f98">waits for the chain</text>
</g>
</svg>