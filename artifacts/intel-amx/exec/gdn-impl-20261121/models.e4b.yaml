# Developer model registry for the E4B check of 2026-11-22 (passed as -DDEV_MODEL_CONFIG=<this file>).
# Question: does Gemma 4 E4B compile at the Part B head, and do its 256-wide attention layers take the AMX kernels?
# The three entries are verbatim copies of config/models.yaml at tron commit 882e5322f1 (branch jhan-gdn-amx).
schema_version: 1
models:
  - name: qwen_3p5_4b
    hf_id: Qwen/Qwen3.5-4B
    support_level: cpp_plugin
    notes: "Qwen3.5 decoder with interleaved GatedDeltaNet and full-attention layers."
    ingest:
      hf_id: Qwen/Qwen3.5-4B
      source: generated
      default_weights: positron-ai/Qwen--Qwen3.5-4B-ingest-best-gptq
    variants:
      - slug: ingested-qwen-3.5-4b
        executors: [tp1, tp2, tp4]
        default_weights: positron-ai/Qwen--Qwen3.5-4B-ingest-best-gptq
        tags: [test]

  - name: gemma_4_e4b_it
    hf_id: google/gemma-4-E4B-it
    support_level: cpp_plugin
    notes: "Generated text-decoder plugin with per-layer input embeddings and operation-owned shared KV; the symmetric GPTQ checkpoint supports tp1, tp2, and tp4."
    ingest:
      hf_id: google/gemma-4-E4B-it
      source: generated
      trace_dir: traces/gemma-4-e4b-it
      default_weights: positron-ai/google--gemma-4-E4B-it-ingest-best-gptq
    variants:
      - slug: ingested-gemma-4-e4b-it
        executors: [tp1, tp2, tp4]
        default_weights: positron-ai/google--gemma-4-E4B-it-ingest-best-gptq
        tags: [test]

  - name: gemma_4_e4b_it_permuted
    hf_id: google/gemma-4-E4B-it
    support_level: cpp_plugin
    notes: "Generated E4B plugin for the GPTQ activation-order checkpoint."
    ingest:
      hf_id: google/gemma-4-E4B-it
      source: generated
      trace_dir: traces/gemma-4-e4b-it-permuted
      default_weights: positron-ai/google--gemma-4-E4B-it-ingest-best-gptq-permuted
      target_executor: permuted
    variants:
      - slug: ingested-gemma-4-e4b-it-permuted
        executors: [perm_tp1]
        default_weights: positron-ai/google--gemma-4-E4B-it-ingest-best-gptq-permuted
        tags: [test]
