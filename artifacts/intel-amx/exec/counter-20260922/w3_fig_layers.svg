<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 572" width="860" height="572" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.pre{fill:#f3e6d3;stroke:#a8691a}.dec{fill:#e3f0f2;stroke:#0b6e7f}.mb{fill:#ffffff;stroke:#5b6770;stroke-dasharray:4 3;stroke-width:1.2}
.job{fill:#eef1ec;stroke:#5b6770}.L{fill:#b3463b;font-weight:600;font-size:10px}
.note{fill:#5b6770;font-size:11px}.mono{font-family:IBM Plex Mono, monospace;font-size:11px;fill:#0b6e7f}.red{fill:#b3463b;font-weight:600;font-size:12px}
.arrow{stroke:#5b6770;stroke-width:1.2;fill:none}
</style>
<defs><marker id="w3l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker></defs>
<text x="10" y="18" class="lvl">One serving forward, from the users down to the attention jobs (the example of Figure 7: 8 users, 135 token jobs)</text>

<text x="10" y="46" class="t">1. users = requests</text>
<text x="10" y="60" class="note">a path in the scheduler's token tree</text>
<g transform="translate(240,34)">
  <rect class="pre" x="0" y="0" width="300" height="26"/><text x="150" y="17" text-anchor="middle" class="t">A: a prompt chunk, 128 tokens</text>
  <g transform="translate(306,0)">
    <rect class="dec" x="0" y="0" width="34" height="26"/><text x="17" y="17" text-anchor="middle" class="t">B</text>
    <rect class="dec" x="38" y="0" width="34" height="26"/><text x="55" y="17" text-anchor="middle" class="t">C</text>
    <rect class="dec" x="76" y="0" width="34" height="26"/><text x="93" y="17" text-anchor="middle" class="t">D</text>
    <rect class="dec" x="114" y="0" width="34" height="26"/><text x="131" y="17" text-anchor="middle" class="t">E</text>
    <rect class="dec" x="152" y="0" width="34" height="26"/><text x="169" y="17" text-anchor="middle" class="t">F</text>
    <rect class="dec" x="190" y="0" width="34" height="26"/><text x="207" y="17" text-anchor="middle" class="t">G</text>
    <rect class="dec" x="228" y="0" width="34" height="26"/><text x="245" y="17" text-anchor="middle" class="t">H</text>
  </g>
  <text x="306" y="40" class="note">B to H: one generated token each</text>
</g>
<text x="10" y="74" class="mono">struct node, node::listeners</text>
<path class="arrow" d="M400 78 L400 96" marker-end="url(#w3l)"/>

<text x="10" y="112" class="t">2. the forward's inputs</text>
<text x="10" y="126" class="note">built once per forward by</text>
<text x="10" y="140" class="note">full_scheduler::forward (tree walk)</text>
<g transform="translate(240,100)">
  <rect class="box" x="0" y="0" width="610" height="96"/>
  <text x="8" y="16" class="mono">tokens[token_id]        135 tokens (token_t), one per token of every live user</text>
  <text x="8" y="32" class="mono">live_groups[token_id]   affinity id per token: A=0, B=1, ..., H=7</text>
  <text x="8" y="48" class="mono">token_jobs[token_job_id] -> token_id   135 jobs: the tokens that need work this forward</text>
  <text x="8" y="64" class="mono">token_jobs_do_kv[token_job_id]  1 = compute and store this token's K and V</text>
  <text x="8" y="80" class="mono">listener_index[listener_id] -> token_id   8 listeners: A's last token, and B to H</text>
</g>
<text x="620" y="126" class="note"></text>
<path class="arrow" d="M400 196 L400 214" marker-end="url(#w3l)"/>

<text x="10" y="232" class="t">3. the model binds them</text>
<text x="10" y="246" class="note">model::state::forward,</text>
<text x="10" y="260" class="note">then run_forward</text>
<g transform="translate(240,218)">
  <rect class="box" x="0" y="0" width="610" height="60"/>
  <text x="8" y="16" class="mono">state.token_jobs, state.listener_index ... (indexed_span members)</text>
  <text x="8" y="32" class="mono">listener_job_index[listener_id] -> token_job_id   (gather_token_job_ids)</text>
  <text x="8" y="48" class="red">class rule: n_listeners == token_jobs.size() ?  8 == 135 -> prompt_or_mixed</text>
</g>
<path class="arrow" d="M400 278 L400 296" marker-end="url(#w3l)"/>

<text x="10" y="314" class="t">4. minibatches</text>
<text x="10" y="328" class="note">std::vector of struct batch,</text>
<text x="10" y="342" class="note">named q_batches; cut by</text>
<text x="10" y="356" class="note">chunk_evenly in grains of 8 jobs</text>
<g transform="translate(240,300)">
  <rect class="mb" x="0" y="0" width="300" height="60"/>
  <text x="8" y="16" class="t">q_batches[0]</text>
  <text x="8" y="32" class="mono">items = vector&lt;token_job_id&gt; (68 jobs)</text>
  <text x="8" y="48" class="note">A's jobs 1 to 64 + B, C, D, E (schematic cut)</text>
  <rect class="mb" x="310" y="0" width="300" height="60"/>
  <text x="318" y="16" class="t">q_batches[1]</text>
  <text x="318" y="32" class="mono">items = vector&lt;token_job_id&gt; (67 jobs)</text>
  <text x="318" y="48" class="note">A's jobs 65 to 128 + F, G, H</text>
</g>
<path class="arrow" d="M400 360 L400 378" marker-end="url(#w3l)"/>

<text x="10" y="396" class="t">5. attention jobs</text>
<text x="10" y="410" class="note">per layer x per minibatch,</text>
<text x="10" y="424" class="note">on every attention worker</text>
<g transform="translate(240,382)">
  <rect class="job" x="0" y="0" width="610" height="60"/>
  <text x="8" y="16" class="mono">run_attention_job(q_batch, layer, worker_ix, ...)   self_attention.hpp:782</text>
  <text x="8" y="32" class="t">one job = the sections of one minibatch's KV pages assigned to one worker, then the join</text>
  <text x="8" y="48" class="note">n_layers x 2 minibatches x n_attn_workers jobs in this forward; each visit inside sees only token_job_id</text>
</g>

<text x="10" y="470" class="note">Every level below 2 sees the token job, not the user. The job knows its token (token_jobs[j]) and the token knows its affinity</text>
<text x="10" y="484" class="note">group (live_groups), but a minibatch takes jobs of several users (level 4). So neither a minibatch nor a forward is "one user's".</text>
<text x="10" y="506" class="note">A minibatch is cut for balance: grains of at most 8 jobs from one affinity group, merged greedily to about equal size, at most</text>
<text x="10" y="520" class="note">max_minibatch_size = 128 jobs (llama.hpp:184). The per-token-job byte of option C is the only tag that survives to level 5.</text>
<text x="10" y="544" class="note">Sources: common.hpp:145-200 (ids), :950-963 (batching note), :990-1030 (struct batch);</text>
<text x="10" y="558" class="note">model.hpp:1815-1826 (construct_minibatches); full.hpp:2330-2478 (the tree walk).</text>
</svg>
