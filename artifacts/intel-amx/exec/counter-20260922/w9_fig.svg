<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a545c"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3463b"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="350" fill="#fbfaf6"/>
  <text x="20" y="26" font-weight="600" font-size="14" fill="#1f2a33">Three stats hooks in self_attention.hpp</text>
  <text x="400" y="26" font-weight="600" font-size="14" fill="#1f2a33">Where the row key comes from</text>

  <!-- hook boxes -->
  <g fill="#ffffff" stroke="#d8ddd6">
    <rect x="20" y="50" width="250" height="52" rx="6"/>
    <rect x="20" y="132" width="250" height="52" rx="6"/>
    <rect x="20" y="214" width="250" height="52" rx="6"/>
  </g>
  <g fill="#1f2a33">
    <text x="32" y="71" font-weight="600">run_attention_job  :855</text>
    <text x="32" y="90" font-family="IBM Plex Mono, monospace" font-size="12">note_attn_job(row, layer, T2)</text>
    <text x="32" y="153" font-weight="600">run_joins  :1343</text>
    <text x="32" y="172" font-family="IBM Plex Mono, monospace" font-size="12">note_join_wait(row, layer, T5)</text>
    <text x="32" y="235" font-weight="600">apply_page_range  :1485</text>
    <text x="32" y="254" font-family="IBM Plex Mono, monospace" font-size="12">add_visits(row, layer, tally)</text>
  </g>

  <!-- speedometer local (main code), top -->
  <rect x="400" y="44" width="290" height="60" rx="6" fill="#ffffff" stroke="#d8ddd6" stroke-dasharray="4 3"/>
  <text x="412" y="64" font-weight="600" fill="#1f2a33">pool_worker_ix  :797  (main code, stays)</text>
  <text x="412" y="82" font-family="IBM Plex Mono, monospace" font-size="12" fill="#1f2a33">tp.num_workers() - n_attn + worker_ix</text>
  <text x="412" y="98" font-size="12" fill="#5b6770">keys the speedometer observation at :837</text>

  <!-- helper box -->
  <rect x="400" y="150" width="290" height="76" rx="6" fill="#e3f0f2" stroke="#0b6e7f"/>
  <text x="412" y="172" font-weight="600" fill="#0b6e7f">model_stats::pool_worker  (attn_stats.hpp)</text>
  <text x="412" y="191" font-family="IBM Plex Mono, monospace" font-size="12" fill="#1f2a33">n_workers - n_attn + attn_ix</text>
  <text x="412" y="209" font-size="12" fill="#5b6770">asserts both inputs; n_workers = attn.size()</text>

  <!-- rows box -->
  <rect x="740" y="150" width="200" height="76" rx="6" fill="#ffffff" stroke="#d8ddd6"/>
  <text x="752" y="172" font-weight="600" fill="#1f2a33">rows</text>
  <text x="752" y="191" font-family="IBM Plex Mono, monospace" font-size="12" fill="#1f2a33">[class][pool worker][layer]</text>
  <text x="752" y="209" font-size="12" fill="#5b6770">sized by attn.size()</text>

  <!-- arrows -->
  <g stroke="#4a545c" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M270,158 L398,180"/>
    <path d="M270,240 C340,240 340,196 398,196"/>
    <path d="M690,188 L738,188"/>
  </g>
  <!-- before: :855 took the speedometer local -->
  <path d="M270,64 L398,64" stroke="#b3463b" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrRed)"/>
  <!-- after: :855 calls the helper -->
  <path d="M270,90 C340,90 340,166 398,166" stroke="#2e7d4f" stroke-width="2.2" fill="none" marker-end="url(#arrG)"/>

  <!-- legend -->
  <g font-size="12">
    <path d="M22,300 L62,300" stroke="#b3463b" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="70" y="304" fill="#1f2a33">before this change: the T2 row took the speedometer's local</text>
    <path d="M22,318 L62,318" stroke="#2e7d4f" stroke-width="2.2"/>
    <text x="70" y="322" fill="#1f2a33">after: the T2 row calls the helper, like the other two hooks</text>
  </g>
  <text x="20" y="342" font-size="12" fill="#5b6770">Equal in production: attn.size() == app_pool().num_workers() (self_attention.hpp:480, :498). The rows are sized by attn.size(), so the helper is the right key.</text>
</svg>
