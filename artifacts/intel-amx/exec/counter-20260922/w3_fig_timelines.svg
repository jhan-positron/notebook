<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 436" width="860" height="436" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.P{fill:#f3e6d3;stroke:#a8691a}.D{fill:#e3f0f2;stroke:#0b6e7f}.idle{fill:none;stroke:#d8ddd6}
.col{fill:none;stroke:#b3463b;stroke-width:1.6}.note{fill:#5b6770;font-size:11px}.red{fill:#b3463b;font-weight:600;font-size:12px}.good{fill:#2e7d4f;font-weight:600;font-size:12px}
.cls{font-size:10px;fill:#1f2a33}
</style>
<text x="10" y="18" class="lvl">Who is in each forward: runtron (all users start together) versus rinzler serving (users arrive at any time)</text>
<text x="10" y="34" class="note">One lane per user, one column per forward, time left to right. P = the user's prompt chunk is in the forward, D = its one generated token is.</text>

<text x="10" y="60" class="t">runtron, 8 users, prompt 1024 (8 chunks), then decode</text>
<g transform="translate(60,68)">
  <text x="-50" y="12" class="note">user A</text><text x="-50" y="30" class="note">user B</text><text x="-50" y="48" class="note">...</text><text x="-50" y="66" class="note">user H</text>
  <g id="rt-row">
  </g>
</g>
<g transform="translate(60,68)" font-size="10">
  <!-- 8 prompt columns then 6 decode columns, for 4 shown lanes -->
  <g>
    <rect class="P" x="0" y="0" width="22" height="16"/><rect class="P" x="24" y="0" width="22" height="16"/><rect class="P" x="48" y="0" width="22" height="16"/><rect class="P" x="72" y="0" width="22" height="16"/><rect class="P" x="96" y="0" width="22" height="16"/><rect class="P" x="120" y="0" width="22" height="16"/><rect class="P" x="144" y="0" width="22" height="16"/><rect class="P" x="168" y="0" width="22" height="16"/>
    <rect class="D" x="200" y="0" width="22" height="16"/><rect class="D" x="224" y="0" width="22" height="16"/><rect class="D" x="248" y="0" width="22" height="16"/><rect class="D" x="272" y="0" width="22" height="16"/><rect class="D" x="296" y="0" width="22" height="16"/><rect class="D" x="320" y="0" width="22" height="16"/>
  </g>
  <g transform="translate(0,18)">
    <rect class="P" x="0" y="0" width="22" height="16"/><rect class="P" x="24" y="0" width="22" height="16"/><rect class="P" x="48" y="0" width="22" height="16"/><rect class="P" x="72" y="0" width="22" height="16"/><rect class="P" x="96" y="0" width="22" height="16"/><rect class="P" x="120" y="0" width="22" height="16"/><rect class="P" x="144" y="0" width="22" height="16"/><rect class="P" x="168" y="0" width="22" height="16"/>
    <rect class="D" x="200" y="0" width="22" height="16"/><rect class="D" x="224" y="0" width="22" height="16"/><rect class="D" x="248" y="0" width="22" height="16"/><rect class="D" x="272" y="0" width="22" height="16"/><rect class="D" x="296" y="0" width="22" height="16"/><rect class="D" x="320" y="0" width="22" height="16"/>
  </g>
  <g transform="translate(0,36)">
    <text x="0" y="12" class="note">(users C to G alike)</text>
  </g>
  <g transform="translate(0,54)">
    <rect class="P" x="0" y="0" width="22" height="16"/><rect class="P" x="24" y="0" width="22" height="16"/><rect class="P" x="48" y="0" width="22" height="16"/><rect class="P" x="72" y="0" width="22" height="16"/><rect class="P" x="96" y="0" width="22" height="16"/><rect class="P" x="120" y="0" width="22" height="16"/><rect class="P" x="144" y="0" width="22" height="16"/><rect class="P" x="168" y="0" width="22" height="16"/>
    <rect class="D" x="200" y="0" width="22" height="16"/><rect class="D" x="224" y="0" width="22" height="16"/><rect class="D" x="248" y="0" width="22" height="16"/><rect class="D" x="272" y="0" width="22" height="16"/><rect class="D" x="296" y="0" width="22" height="16"/><rect class="D" x="320" y="0" width="22" height="16"/>
  </g>
  <text x="350" y="12" class="note">... 255 decode forwards</text>
  <g transform="translate(0,76)">
    <text x="0" y="10" class="cls">forward class:</text>
    <text x="95" y="10" class="cls">P P P P P P P P = prompt_or_mixed (8 forwards of 1,024 jobs), then D D D ... = decode_like (255 forwards of 8 jobs)</text>
  </g>
</g>
<text x="60" y="168" class="good">Every column holds one kind of work. The class is exact here. So the runtron runs could not show the problem.</text>

<text x="10" y="204" class="t">rinzler serving, continuous batching: the same 8 users, but user A arrives while B to H are decoding</text>
<g transform="translate(60,212)" font-size="10">
  <text x="-50" y="12" class="note">user A</text><text x="-50" y="30" class="note">user B</text><text x="-50" y="48" class="note">...</text><text x="-50" y="66" class="note">user H</text>
  <g>
    <rect class="idle" x="0" y="0" width="22" height="16"/><rect class="idle" x="24" y="0" width="22" height="16"/><rect class="idle" x="48" y="0" width="22" height="16"/>
    <rect class="P" x="72" y="0" width="22" height="16"/><rect class="P" x="96" y="0" width="22" height="16"/><rect class="P" x="120" y="0" width="22" height="16"/><rect class="P" x="144" y="0" width="22" height="16"/><rect class="P" x="168" y="0" width="22" height="16"/><rect class="P" x="192" y="0" width="22" height="16"/><rect class="P" x="216" y="0" width="22" height="16"/><rect class="P" x="240" y="0" width="22" height="16"/>
    <rect class="D" x="264" y="0" width="22" height="16"/><rect class="D" x="288" y="0" width="22" height="16"/><rect class="D" x="312" y="0" width="22" height="16"/>
  </g>
  <g transform="translate(0,18)">
    <rect class="D" x="0" y="0" width="22" height="16"/><rect class="D" x="24" y="0" width="22" height="16"/><rect class="D" x="48" y="0" width="22" height="16"/><rect class="D" x="72" y="0" width="22" height="16"/><rect class="D" x="96" y="0" width="22" height="16"/><rect class="D" x="120" y="0" width="22" height="16"/><rect class="D" x="144" y="0" width="22" height="16"/><rect class="D" x="168" y="0" width="22" height="16"/><rect class="D" x="192" y="0" width="22" height="16"/><rect class="D" x="216" y="0" width="22" height="16"/><rect class="D" x="240" y="0" width="22" height="16"/><rect class="D" x="264" y="0" width="22" height="16"/><rect class="D" x="288" y="0" width="22" height="16"/><rect class="D" x="312" y="0" width="22" height="16"/>
  </g>
  <g transform="translate(0,36)">
    <text x="0" y="12" class="note">(users C to G alike: decoding)</text>
  </g>
  <g transform="translate(0,54)">
    <rect class="D" x="0" y="0" width="22" height="16"/><rect class="D" x="24" y="0" width="22" height="16"/><rect class="D" x="48" y="0" width="22" height="16"/><rect class="D" x="72" y="0" width="22" height="16"/><rect class="D" x="96" y="0" width="22" height="16"/><rect class="D" x="120" y="0" width="22" height="16"/><rect class="D" x="144" y="0" width="22" height="16"/><rect class="D" x="168" y="0" width="22" height="16"/><rect class="D" x="192" y="0" width="22" height="16"/><rect class="D" x="216" y="0" width="22" height="16"/><rect class="D" x="240" y="0" width="22" height="16"/><rect class="D" x="264" y="0" width="22" height="16"/><rect class="D" x="288" y="0" width="22" height="16"/><rect class="D" x="312" y="0" width="22" height="16"/>
  </g>
  <rect class="col" x="70" y="-4" width="26" height="78"/>
  <text x="350" y="12" class="note">the red column = the forward of Figure 7:</text>
  <text x="350" y="26" class="note">A's chunk (128 jobs, 1 listener) + B to H (7 jobs, 7 listeners)</text>
  <text x="350" y="40" class="note">= 135 jobs, 8 listeners, class prompt_or_mixed</text>
  <g transform="translate(0,76)">
    <text x="0" y="10" class="cls">forward class:</text>
    <text x="95" y="10" class="cls">D D D = decode_like, then 8 columns prompt_or_mixed (with 7 decode jobs each), then decode_like again</text>
  </g>
</g>
<text x="60" y="312" class="red">While A's 8 prompt chunks run, 8 forwards carry B to H's decode work under prompt_or_mixed.</text>
<text x="60" y="328" class="red">With users arriving at random times, many forwards look like the red column:</text>
<text x="60" y="344" class="red">est. 22 % of forwards at prompt 1024 and 83 % at prompt 8192 (verdict list below).</text>
<text x="10" y="372" class="note">Why the mix happens: full_scheduler::forward walks the whole token tree every forward and emits a token job for every live token</text>
<text x="10" y="386" class="note">without a KV entry, of every user, up to the per-forward token limit [full.hpp:2330-2478]. Nothing groups by user or by kind of work.</text>
<text x="10" y="400" class="note">Why runtron differs: it submits all 8 prompts at once, so every user is in the same phase in every forward.</text>
<text x="10" y="422" class="note">Columns are schematic (a real run has 255 decode forwards). The mixed share is an estimate (est.), see the verdict list.</text>
</svg>
