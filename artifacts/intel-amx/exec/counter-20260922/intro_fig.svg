<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 704" width="860" height="704" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<defs>
<marker id="zoom" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6"><circle cx="4" cy="4" r="3" fill="#0b6e7f"/></marker>
</defs>
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.hl{stroke:#0b6e7f;stroke-width:2;fill:#e3f0f2}
.pre{fill:#f3e6d3;stroke:#a8691a}.dec{fill:#e3f0f2;stroke:#0b6e7f}
.amx{fill:#2e7d4f}.avx{fill:#3b6fb6}.emp{fill:#c9ced0}
.wait{fill:none;stroke:#a8691a;stroke-dasharray:4 3}
.zl{stroke:#0b6e7f;stroke-width:1.2;fill:none;stroke-dasharray:3 3}
.cnt{fill:#0b6e7f;font-family:IBM Plex Mono, monospace;font-size:11px}
.note{fill:#5b6770;font-size:11px}
</style>

<!-- Level 1: one run -->
<text x="10" y="22" class="lvl">1. One run (one model state): a sequence of forwards</text>
<g transform="translate(10,32)">
  <rect class="pre" x="0" y="0" width="44" height="26"/><text x="22" y="17" text-anchor="middle" class="t">P</text>
  <rect class="pre" x="48" y="0" width="44" height="26"/><text x="70" y="17" text-anchor="middle" class="t">P</text>
  <rect class="pre" x="96" y="0" width="44" height="26"/><text x="118" y="17" text-anchor="middle" class="t">P</text>
  <rect class="hl" x="144" y="0" width="30" height="26"/><text x="159" y="17" text-anchor="middle" class="t">D</text>
  <rect class="dec" x="178" y="0" width="30" height="26"/><text x="193" y="17" text-anchor="middle" class="t">D</text>
  <rect class="dec" x="212" y="0" width="30" height="26"/><text x="227" y="17" text-anchor="middle" class="t">D</text>
  <rect class="pre" x="246" y="0" width="44" height="26"/><text x="268" y="17" text-anchor="middle" class="t">P+D</text>
  <rect class="dec" x="294" y="0" width="30" height="26"/><text x="309" y="17" text-anchor="middle" class="t">D</text>
  <text x="332" y="17" class="m">... time</text>
  <text x="0" y="46" class="note">P = prompt chunks (prompt_or_mixed), D = one generated token per user (decode_like), P+D = a mixed forward under serving (also prompt_or_mixed)</text>
</g>
<g transform="translate(560,30)">
  <text x="0" y="0" class="cnt">forwards, wall_cycles (T1), token_jobs,</text>
  <text x="0" y="14" class="cnt">fpga_queries, token_jobs_by_path_set</text>
  <text x="0" y="30" class="note">per class; leaves &lt;class&gt;_forwards</text>
</g>
<path class="zl" d="M169 58 L169 92" marker-end="url(#zoom)"/>

<!-- Level 2: one forward -->
<text x="10" y="106" class="lvl">2. One forward: every layer, one attention job per (layer, minibatch) on each attention worker</text>
<g transform="translate(10,116)">
  <rect class="box" x="0" y="0" width="520" height="54"/>
  <text x="6" y="14" class="m">layer 0</text>
  <rect class="box" x="6" y="18" width="52" height="30"/><text x="32" y="37" text-anchor="middle" class="t">attn</text>
  <text x="66" y="37" class="m">FFN</text>
  <text x="96" y="14" class="m">layer 1</text>
  <rect class="box" x="96" y="18" width="52" height="30"/><text x="122" y="37" text-anchor="middle" class="t">attn</text>
  <text x="156" y="37" class="m">FFN</text>
  <text x="186" y="14" class="m">layer 2</text>
  <rect class="hl" x="186" y="18" width="52" height="30"/><text x="212" y="37" text-anchor="middle" class="t">attn</text>
  <text x="246" y="37" class="m">FFN</text>
  <text x="280" y="37" class="m">...</text>
  <text x="310" y="14" class="m">layer 35</text>
  <rect class="box" x="310" y="18" width="52" height="30"/><text x="336" y="37" text-anchor="middle" class="t">attn</text>
  <text x="370" y="37" class="m">FFN</text>
  <text x="410" y="37" class="m">logits</text>
  <text x="0" y="70" class="note">T1 = wall of the whole forward, logits delivery included.</text>
  <text x="0" y="84" class="note">T4 = first job of layer L to first job of layer L+1, seen by worker 0.</text>
</g>
<g transform="translate(560,120)">
  <text x="0" y="0" class="cnt">per (class, worker, layer) row:</text>
  <text x="0" y="14" class="cnt">attn_jobs, busy_cycles (T2),</text>
  <text x="0" y="28" class="cnt">wall_cycles_w0 (T3), period_cycles_w0 (T4)</text>
  <text x="0" y="44" class="cnt">per (class, layer): fpga_k_tokens,</text>
  <text x="0" y="58" class="cnt">fpga_query_passes (main thread, HW job prep)</text>
</g>
<path class="zl" d="M222 164 L222 198" marker-end="url(#zoom)"/>

<!-- Level 3: one attention job -->
<text x="10" y="228" class="lvl">3. One attention job on one worker: two software passes, then the join</text>
<g transform="translate(10,238)">
  <rect class="box" x="0" y="0" width="130" height="30"/><text x="65" y="19" text-anchor="middle" class="t">ready pass</text>
  <rect class="wait" x="134" y="0" width="64" height="30"/><text x="166" y="19" text-anchor="middle" class="m">K/V wait</text>
  <rect class="hl" x="202" y="0" width="96" height="30"/><text x="250" y="19" text-anchor="middle" class="t">pending pass</text>
  <rect class="wait" x="302" y="0" width="90" height="30"/><text x="347" y="19" text-anchor="middle" class="m">join wait</text>
  <rect class="box" x="396" y="0" width="90" height="30"/><text x="441" y="19" text-anchor="middle" class="t">join fold</text>
  <text x="0" y="46" class="note">T2 (busy) = ready + K/V wait + pending + join, as attn_elapsed measures it today.</text>
  <text x="0" y="60" class="note">T3 (wall, worker 0) = entry to return of the job.</text>
  <text x="0" y="74" class="note">T5 = join wait, timed today only in the FPGA join loop (stream_hw_joins).</text>
  <text x="0" y="88" class="note">The software-only poll in run_joins is not timed (Wade W1).</text>
</g>
<g transform="translate(560,242)">
  <text x="0" y="0" class="cnt">join_wait_cycles (T5)</text>
  <text x="0" y="16" class="note">dashed = waiting (a spin, the core looks busy)</text>
</g>
<path class="zl" d="M260 270 L260 340" marker-end="url(#zoom)"/>

<!-- Level 4: one pass = apply_page_range calls = visits -->
<text x="10" y="354" class="lvl">4. One pass: apply_page_range per (KV head, page range), one visit per (query token, page, KV head)</text>
<g transform="translate(10,364)">
  <text x="0" y="14" class="m">KV head 0, pages 0..16 of user A</text>
  <g transform="translate(0,20)">
    <rect class="amx" x="0" y="0" width="22" height="16"/><rect class="amx" x="24" y="0" width="22" height="16"/><rect class="amx" x="48" y="0" width="22" height="16"/><rect class="amx" x="72" y="0" width="22" height="16"/><rect class="amx" x="96" y="0" width="22" height="16"/><rect class="amx" x="120" y="0" width="22" height="16"/><rect class="amx" x="144" y="0" width="22" height="16"/><rect class="amx" x="168" y="0" width="22" height="16"/>
    <rect class="amx" x="192" y="0" width="22" height="16"/><rect class="amx" x="216" y="0" width="22" height="16"/><rect class="amx" x="240" y="0" width="22" height="16"/><rect class="amx" x="264" y="0" width="22" height="16"/><rect class="amx" x="288" y="0" width="22" height="16"/><rect class="amx" x="312" y="0" width="22" height="16"/><rect class="amx" x="336" y="0" width="22" height="16"/><rect class="amx" x="360" y="0" width="22" height="16"/>
    <rect class="avx" x="384" y="0" width="22" height="16"/>
    <text x="0" y="30" class="note">16 dense pages on AMX, the partial newest page on AVX</text>
  </g>
  <text x="0" y="68" class="m">KV head 0, pages of user B under FPGA attention</text>
  <g transform="translate(0,74)">
    <rect class="emp" x="0" y="0" width="22" height="16"/><rect class="emp" x="24" y="0" width="22" height="16"/><rect class="emp" x="48" y="0" width="22" height="16"/><rect class="emp" x="72" y="0" width="22" height="16"/><rect class="emp" x="96" y="0" width="22" height="16"/>
    <rect class="avx" x="120" y="0" width="22" height="16"/>
    <text x="0" y="30" class="note">empty visits (the range belongs to the card), then the AVX tail of 1 to 4 tokens</text>
  </g>
  <g transform="translate(0,118)">
    <rect class="amx" x="0" y="0" width="12" height="12"/><text x="16" y="10" class="note">amx: whole dense page, 64 K tokens</text>
    <rect class="avx" x="250" y="0" width="12" height="12"/><text x="266" y="10" class="note">avx: the relevant K tokens</text>
    <rect class="emp" x="430" y="0" width="12" height="12"/><text x="446" y="10" class="note">empty: no software work</text>
  </g>
</g>
<g transform="translate(560,368)">
  <text x="0" y="0" class="cnt">per call, on the stack (visit_tally):</text>
  <text x="0" y="14" class="cnt">visits[path], k_tokens[path],</text>
  <text x="0" y="28" class="cnt">avx_full_page_visits; then one</text>
  <text x="0" y="42" class="cnt">add_visits into row[class][worker][layer]</text>
  <text x="0" y="60" class="cnt">per visit: path_bits[worker][token job]</text>
  <text x="0" y="74" class="cnt">|= bit(path), folded at end_forward</text>
</g>

<!-- Level 5: where the row lives -->
<text x="10" y="518" class="lvl">5. Where the numbers land: rows [class][worker][layer], leaves under /model/&lt;id&gt;/attention/</text>
<g transform="translate(10,528)">
  <rect class="box" x="0" y="0" width="256" height="124"/>
  <text x="8" y="16" class="t">class = decode_like</text>
  <text x="8" y="34" class="m">worker 0: layer 0 .. 35 rows</text>
  <text x="8" y="50" class="m">worker 1: layer 0 .. 35 rows</text>
  <text x="8" y="66" class="m">...</text>
  <text x="8" y="82" class="m">worker 26: rows never used, read 0</text>
  <text x="8" y="100" class="note">sized by the app pool (27 workers),</text>
  <text x="8" y="114" class="note">indexed by attention worker (0..19)</text>
  <rect class="box" x="270" y="0" width="256" height="124"/>
  <text x="278" y="16" class="t">class = prompt_or_mixed</text>
  <text x="278" y="34" class="m">same shape</text>
  <text x="278" y="60" class="note">Wade W5: the index is the attention</text>
  <text x="278" y="74" class="note">worker, not the pool thread; the</text>
  <text x="278" y="88" class="note">split can change between forwards</text>
</g>
<g transform="translate(560,532)">
  <text x="0" y="0" class="cnt">summary, &lt;class&gt;_totals,</text>
  <text x="0" y="14" class="cnt">&lt;class&gt;_forwards,</text>
  <text x="0" y="28" class="cnt">&lt;class&gt;_layer_&lt;L&gt;, &lt;class&gt;_worker_&lt;W&gt;</text>
  <text x="0" y="46" class="note">plus one [attn-stats] stderr report</text>
  <text x="0" y="60" class="note">when the model state is destroyed</text>
</g>
<text x="10" y="674" class="note">Reading direction: each band zooms into the highlighted element of the band above (dotted line). Widths are schematic, not to scale.</text>
<text x="10" y="690" class="note">Counters never reset: an interval is the difference of two reads. All timers are TSC cycles (summary carries tsc_hz).</text>
</svg>
