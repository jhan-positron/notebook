<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.step{fill:#e3f0f2;stroke:#0b6e7f}.miss{fill:none;stroke:#b3463b;stroke-dasharray:4 3;stroke-width:1.4}.ok{fill:#e3f0e8;stroke:#2e7d4f}
.note{fill:#5b6770;font-size:11px}.good{fill:#2e7d4f;font-weight:600;font-size:12px}.red{fill:#b3463b;font-weight:600;font-size:12px}
.mono{font-family:IBM Plex Mono, monospace;font-size:11px}.arrow{stroke:#5b6770;stroke-width:1.2;fill:none}
</style>
<defs><marker id="w4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker></defs>
<text x="10" y="18" class="lvl">Why the tests needed the guards: the production sequence versus the four test fixtures</text>

<text x="10" y="48" class="t">production</text>
<g transform="translate(140,32)">
  <rect class="step" x="0" y="0" width="150" height="26"/><text x="75" y="17" text-anchor="middle" class="t">state built, rows sized</text>
  <path class="arrow" d="M152 13 L170 13" marker-end="url(#w4b)"/>
  <rect class="step" x="172" y="0" width="190" height="26"/><text x="267" y="17" text-anchor="middle" class="t">begin_forward sizes the bytes</text>
  <path class="arrow" d="M364 13 L382 13" marker-end="url(#w4b)"/>
  <rect class="step" x="384" y="0" width="170" height="26"/><text x="469" y="17" text-anchor="middle" class="t">apply_page_range, hooks</text>
  <path class="arrow" d="M556 13 L574 13" marker-end="url(#w4b)"/>
  <rect class="step" x="576" y="0" width="120" height="26"/><text x="636" y="17" text-anchor="middle" class="t">end_forward</text>
</g>

<text x="10" y="104" class="t">four fixtures today</text>
<g transform="translate(140,88)">
  <rect class="step" x="0" y="0" width="150" height="26"/><text x="75" y="17" text-anchor="middle" class="t">state built, rows sized</text>
  <path class="arrow" d="M152 13 L170 13" marker-end="url(#w4b)"/>
  <rect class="miss" x="172" y="0" width="190" height="26"/><text x="267" y="17" text-anchor="middle" class="red">no begin_forward</text>
  <path class="arrow" d="M364 13 L382 13" marker-end="url(#w4b)"/>
  <rect class="step" x="384" y="0" width="170" height="26"/><text x="469" y="17" text-anchor="middle" class="t">apply_page_range, hooks</text>
  <text x="0" y="46" class="red">path-bit vectors are empty, so the per-visit bound and the span guard hide the missing step</text>
  <text x="0" y="62" class="note">t_llama_unit.cpp:2204 and the check_page_range_reductions fixture (:2330, and again after the resize at :2548),</text>
  <text x="0" y="76" class="note">t_amx_dispatch_dtype.cpp:169, heterogeneous_scheduler_compile.cpp (real state, run_attention_job at :656, :703)</text>
</g>

<text x="10" y="200" class="t">fixtures after W4</text>
<g transform="translate(140,184)">
  <rect class="step" x="0" y="0" width="150" height="26"/><text x="75" y="17" text-anchor="middle" class="t">state built, rows sized</text>
  <path class="arrow" d="M152 13 L170 13" marker-end="url(#w4b)"/>
  <rect class="ok" x="172" y="0" width="190" height="26"/><text x="267" y="17" text-anchor="middle" class="t">begin_forward / forward_scope</text>
  <path class="arrow" d="M364 13 L382 13" marker-end="url(#w4b)"/>
  <rect class="step" x="384" y="0" width="170" height="26"/><text x="469" y="17" text-anchor="middle" class="t">apply_page_range, hooks</text>
  <path class="arrow" d="M556 13 L574 13" marker-end="url(#w4b)"/>
  <rect class="step" x="576" y="0" width="120" height="26"/><text x="636" y="17" text-anchor="middle" class="t">end_forward</text>
  <text x="0" y="46" class="good">same sequence as production, every index in range, every guard becomes an assert</text>
  <text x="0" y="62" class="note">plus one negative test: a forked child calls a hook with a bad index and must die with SIGABRT</text>
<text x="0" y="76" class="note">(the assertion_signal helper of t_llama_unit.cpp:271-283 and t_compute_attention_unit.cpp:22-34, moved to a header)</text>
</g>
<text x="10" y="284" class="note">The fixture at t_llama_unit.cpp:2548 grows the scratchpad vector after the rows were sized; it rebuilds the stats object for the grown size.</text>
</svg>
