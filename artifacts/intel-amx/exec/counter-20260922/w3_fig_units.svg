<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 382" width="860" height="382" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.pre{fill:#f3e6d3;stroke:#a8691a}.dec{fill:#e3f0f2;stroke:#0b6e7f}
.note{fill:#5b6770;font-size:11px}.red{fill:#b3463b;font-weight:600;font-size:12px}.good{fill:#2e7d4f;font-weight:600;font-size:12px}
.grp{fill:none;stroke:#5b6770;stroke-dasharray:4 3;stroke-width:1.2}.mono{font-family:IBM Plex Mono, monospace;font-size:11px}
</style>
<text x="10" y="18" class="lvl">Three possible units for the class, on the same 135 token jobs (A = 128 prompt jobs, B to H = 7 decode jobs)</text>

<text x="10" y="48" class="t">1. per forward (today)</text>
<g transform="translate(200,34)">
  <rect class="grp" x="-6" y="-6" width="652" height="32"/>
  <rect class="pre" x="0" y="0" width="480" height="20"/><text x="240" y="14" text-anchor="middle" class="t">A (128)</text>
  <g transform="translate(486,0)"><rect class="dec" x="0" y="0" width="22" height="20"/><rect class="dec" x="24" y="0" width="22" height="20"/><rect class="dec" x="48" y="0" width="22" height="20"/><rect class="dec" x="72" y="0" width="22" height="20"/><rect class="dec" x="96" y="0" width="22" height="20"/><rect class="dec" x="120" y="0" width="22" height="20"/><rect class="dec" x="144" y="0" width="22" height="20"/></g>
</g>
<text x="200" y="80" class="red">one label for all 135 jobs: prompt_or_mixed. The 7 decode jobs land under prompt_or_mixed.</text>

<text x="10" y="128" class="t">2. per minibatch (rejected)</text>
<g transform="translate(200,114)">
  <rect class="grp" x="-6" y="-6" width="334" height="32"/>
  <rect class="pre" x="0" y="0" width="240" height="20"/><text x="120" y="14" text-anchor="middle" class="t">A jobs 1 to 64</text>
  <g transform="translate(246,0)"><rect class="dec" x="0" y="0" width="18" height="20"/><rect class="dec" x="20" y="0" width="18" height="20"/><rect class="dec" x="40" y="0" width="18" height="20"/><rect class="dec" x="60" y="0" width="18" height="20"/></g>
  <rect class="grp" x="336" y="-6" width="310" height="32"/>
  <rect class="pre" x="342" y="0" width="240" height="20"/><text x="462" y="14" text-anchor="middle" class="t">A jobs 65 to 128</text>
  <g transform="translate(588,0)"><rect class="dec" x="0" y="0" width="18" height="20"/><rect class="dec" x="20" y="0" width="18" height="20"/><rect class="dec" x="40" y="0" width="18" height="20"/></g>
</g>
<text x="200" y="160" class="red">chunk_evenly makes minibatches of roughly equal size and can mix users in one minibatch.</text>
<text x="200" y="176" class="red">The cut drawn is schematic. It depends on the affinity-id order and the even/odd pair fix:</text>
<text x="200" y="192" class="red">72 + 63, 71 + 64 or 68 + 67 jobs (0 and 7, 7 and 0, or 4 and 3 decode jobs).</text>
<text x="200" y="208" class="red">Same problem, per minibatch.</text>

<text x="10" y="240" class="t">3. per token job (works)</text>
<g transform="translate(200,226)">
  <rect class="pre" x="0" y="0" width="480" height="20"/><text x="240" y="14" text-anchor="middle" class="t">A (128): 127 kv_only + 1 with_listener</text>
  <g transform="translate(486,0)"><rect class="dec" x="0" y="0" width="22" height="20"/><rect class="dec" x="24" y="0" width="22" height="20"/><rect class="dec" x="48" y="0" width="22" height="20"/><rect class="dec" x="72" y="0" width="22" height="20"/><rect class="dec" x="96" y="0" width="22" height="20"/><rect class="dec" x="120" y="0" width="22" height="20"/><rect class="dec" x="144" y="0" width="22" height="20"/></g>
  <text x="486" y="34" class="note">7 with_listener</text>
</g>
<text x="200" y="282" class="good">one byte per job (has_listener, built before the workers start).</text>
<text x="200" y="298" class="good">Each visit reads it and picks one of two tallies.</text>
<text x="200" y="316" class="note">Over-count: the last job of every prompt chunk also has a listener (8 of 1,024 prompt jobs at prompt 1024),</text>
<text x="200" y="330" class="note">as do cached-prompt re-queries and speculative verify tokens. The timers (T2 to T5) stay per attention job.</text>
<text x="10" y="364" class="note">Dashed frame = the unit that receives one class label. The per-job tag is the only unit where a decode job is never inside a prompt frame.</text>
</svg>
