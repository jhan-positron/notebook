<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<defs>
<marker id="w2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker>
<marker id="w2bS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d4f"/></marker>
<marker id="w2bC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6a4c93"/></marker>
</defs>
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.gone{fill:#f3f4f2;stroke:#d8ddd6;stroke-dasharray:4 3}.call{stroke:#5b6770;stroke-width:1.2;fill:none}
.S{fill:#e3f0e8;stroke:#2e7d4f}.C{fill:#ece6f4;stroke:#6a4c93}
.tS{fill:#2e7d4f;font-weight:600}.tC{fill:#6a4c93;font-weight:600}
.fS{fill:#2e7d4f}.fC{fill:#6a4c93}
.lS{stroke:#2e7d4f;stroke-width:1.4;fill:none}.lC{stroke:#6a4c93;stroke-width:1.4;fill:none}
.mono{font-family:IBM Plex Mono, monospace;font-size:11px}
.note{fill:#5b6770;font-size:11px}.gonet{fill:#8a949b}
</style>
<text x="10" y="18" class="lvl">After the fix: one owner, forward_scope, at the top of model::state::forward</text>

<rect class="gone" x="10" y="34" width="470" height="40"/>
<text x="18" y="50" class="gonet">full_scheduler::forward</text><text x="18" y="64" class="note">no stats code any more: full.hpp leaves the PR</text>

<path class="call" d="M245 74 L245 96" marker-end="url(#w2b)"/><text x="253" y="90" class="note">state.forward(...)</text>

<rect class="box" x="10" y="98" width="470" height="190"/>
<text x="18" y="114" class="t">model::state::forward</text><text x="18" y="128" class="note mono">model.hpp:1639-1683</text>
<rect class="S" x="18" y="134" width="454" height="76"/>
<text x="26" y="150" class="tS">forward_scope</text><text x="132" y="150" class="t">one object, the first statement after the perfetto slice</text>
<text x="26" y="166" class="t" font-size="11">constructor: store the class, begin_forward, start stamp</text>
<text x="26" y="180" class="t" font-size="11">destructor, at the closing brace of forward(): stop stamp,</text>
<text x="26" y="193" class="t" font-size="11">note_forward_wall, end_forward</text>
<text x="26" y="206" class="note">the latch guard is declared after it, so the guard is released first</text>
<rect class="box" x="18" y="216" width="454" height="64"/>
<text x="26" y="232" class="t">run_forward: no stats calls left</text>
<rect class="C" x="26" y="240" width="446" height="18"/><text x="32" y="253" class="tC" font-size="11">writer C stays</text><text x="130" y="253" class="t" font-size="11">construct_hw_plan: note_fpga_query, in the scope's lifetime</text>
<text x="26" y="274" class="note">layers, logits, listener delivery: all inside the scope's lifetime</text>

<rect class="box" x="600" y="98" width="250" height="190"/>
<text x="608" y="114" class="t">The record: forward_counters</text>
<text x="620" y="140" class="mono fS">forwards</text>
<text x="620" y="156" class="mono fS">wall_cycles (T1)</text>
<text x="620" y="172" class="mono fS">wall_max_cycles</text>
<text x="620" y="188" class="mono fC">fpga_queries</text>
<text x="620" y="204" class="mono fS">token_jobs</text>
<text x="620" y="220" class="mono fS">token_jobs_by_path_set[8]</text>
<text x="608" y="252" class="note">current_class: stored by the scope</text>
<text x="608" y="266" class="note">before anything reads it</text>

<path class="lS" d="M472 172 C540 172 560 172 618 172" marker-end="url(#w2bS)"/>
<path class="lC" d="M472 249 C540 249 560 190 618 188" marker-end="url(#w2bC)"/>

<text x="10" y="312" class="note">Every caller of model::state::forward now gets a complete record. The class is stored before any counter is read.</text>
<text x="10" y="326" class="note">The wall and the fold are written by one object at one point. T1 keeps the span of the perfetto "forward" slice.</text>
</svg>
