<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.work{fill:#e3f0f2;stroke:#0b6e7f}.fold{fill:#ffffff;stroke:#0b6e7f}
.wait{fill:none;stroke:#a8691a;stroke-dasharray:4 3;stroke-width:1.4}
.note{fill:#5b6770;font-size:11px}.red{fill:#b3463b;font-weight:600;font-size:12px}
.brk{stroke:#b3463b;stroke-width:1.4;fill:none}
</style>
<text x="10" y="18" class="lvl">One software-only layer, two attention workers sharing KV head 3 (wall-clock lanes, durations schematic)</text>
<text x="10" y="52" class="t">worker A</text>
<g transform="translate(80,38)">
<rect class="work" x="0" y="0" width="420" height="24"/><text x="210" y="16" text-anchor="middle" class="t">run_sections: ready pass + pending pass (head 3, long section)</text>
<rect class="fold" x="424" y="0" width="120" height="24"/><text x="484" y="16" text-anchor="middle" class="t">join fold, head 3</text>
</g>
<text x="10" y="102" class="t">worker B</text>
<g transform="translate(80,88)">
<rect class="work" x="0" y="0" width="200" height="24"/><text x="100" y="16" text-anchor="middle" class="t">run_sections (short)</text>
<rect class="wait" x="204" y="0" width="216" height="24"/><text x="312" y="16" text-anchor="middle" class="m">run_joins poll: sections_left[3] != 0</text>
<rect class="fold" x="424" y="0" width="120" height="24"/><text x="484" y="16" text-anchor="middle" class="t">join fold, head 3</text>
</g>
<!-- bracket for the untimed spin -->
<path class="brk" d="M284 124 L284 132 L500 132 L500 124"/>
<text x="392" y="148" text-anchor="middle" class="red">untimed today: inside T2 (busy), outside T5</text>
<text x="10" y="176" class="note">T2 of worker B = its whole lane. T5 of worker B today = 0 (join_hw is false, so stream_hw_joins never runs).</text>
<text x="10" y="192" class="note">With the W1 fix, the dashed stretch becomes T5: rdtsc at its first failed poll, rdtsc at the poll that proceeds.</text>
</svg>
