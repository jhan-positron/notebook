<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.src{fill:#e3f0f2;stroke:#0b6e7f}.bound{fill:#e3f0e8;stroke:#2e7d4f}
.note{fill:#5b6770;font-size:11px}.good{fill:#2e7d4f;font-weight:600;font-size:12px}.red{fill:#b3463b;font-weight:600;font-size:12px}
.mono{font-family:IBM Plex Mono, monospace;font-size:11px}.arrow{stroke:#5b6770;stroke-width:1.2;fill:none}
</style>
<defs><marker id="w4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker></defs>
<text x="10" y="18" class="lvl">The three indices every hook takes, where each comes from, and the bound its producer keeps</text>

<text x="10" y="48" class="t">index</text><text x="130" y="48" class="t">producer in production</text><text x="520" y="48" class="t">bound (rows, layers, bytes)</text>

<rect class="src" x="130" y="58" width="370" height="40"/>
<text x="10" y="82" class="mono">worker</text>
<text x="138" y="74" class="t">attention worker i of this forward, i &lt; n_attn_workers</text>
<text x="138" y="90" class="note">self_attention.hpp:1671-1674; the bound: model.hpp:2286</text>
<path class="arrow" d="M500 78 L518 78" marker-end="url(#w4a)"/>
<rect class="bound" x="520" y="58" width="330" height="40"/>
<text x="528" y="74" class="t">rows sized by the pool size: attn.size()</text>
<text x="528" y="90" class="note">self_attention.hpp:480, :498</text>

<rect class="src" x="130" y="110" width="370" height="40"/>
<text x="10" y="134" class="mono">layer</text>
<text x="138" y="126" class="t">the plugin's layer id of the attention operation</text>
<text x="138" y="142" class="note">ids 0..n_layers-1 from the plugin table (llama.hpp:204-205)</text>
<path class="arrow" d="M500 130 L518 130" marker-end="url(#w4a)"/>
<rect class="bound" x="520" y="110" width="330" height="40"/>
<text x="528" y="126" class="t">rows sized by n_layers</text>
<text x="528" y="142" class="note">self_attention.hpp:498</text>

<rect class="src" x="130" y="162" width="370" height="40"/>
<text x="10" y="186" class="mono">token job</text>
<text x="138" y="178" class="t">tok_ix of the visit, or the job of an FPGA pass</text>
<text x="138" y="194" class="note">both are below token_jobs.size() of the forward</text>
<path class="arrow" d="M500 182 L518 182" marker-end="url(#w4a)"/>
<rect class="bound" x="520" y="162" width="330" height="40"/>
<text x="528" y="178" class="t">path bytes sized by begin_forward(token_jobs.size())</text>
<text x="528" y="194" class="note">model.hpp:1745, before the plugin runs (:1749)</text>

<text x="10" y="232" class="good">So in production no index is ever out of range. The nine guards never fire there.</text>
<text x="10" y="250" class="red">They fire only in unit tests that drive the hooks without begin_forward, or with a grown scratchpad vector.</text>
<text x="10" y="278" class="note">A guard: `if (worker &gt;= n_workers) return;`, the count is dropped and nothing is logged. An assert: `TRON_ASSERT_LT(worker, n_workers)`,</text>
<text x="10" y="292" class="note">the process aborts with a message. Both cost one compare. The assert turns a future indexing bug into a crash in CI instead of a wrong total.</text>
<text x="10" y="316" class="note">Measured agreement: active_workers was 20 or 26 of 27 pool workers in every run, never above.</text>
</svg>
