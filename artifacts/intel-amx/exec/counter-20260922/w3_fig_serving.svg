<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.pre{fill:#f3e6d3;stroke:#a8691a}.dec{fill:#e3f0f2;stroke:#0b6e7f}
.L{fill:#b3463b;font-weight:600;font-size:10px}.note{fill:#5b6770;font-size:11px}.red{fill:#b3463b;font-weight:600;font-size:12px}
.bin{fill:#ffffff;stroke:#5b6770;stroke-width:1.2}.binP{fill:#fbf3e8;stroke:#a8691a;stroke-width:1.4}
.arrow{stroke:#5b6770;stroke-width:1.2;fill:none}.mono{font-family:IBM Plex Mono, monospace;font-size:11px}
</style>
<defs><marker id="w3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker></defs>
<text x="10" y="18" class="lvl">One serving forward (rinzler, continuous batching): user A sends a prompt chunk while users B to H decode</text>
<text x="10" y="44" class="t">token jobs of the forward (135 in this example)</text>
<g transform="translate(10,52)">
  <rect class="pre" x="0" y="0" width="480" height="26"/>
  <text x="240" y="17" text-anchor="middle" class="t">user A: prompt chunk, 128 token jobs (default chunk size), only the last one has a listener</text>
  <rect class="pre" x="466" y="0" width="14" height="26" stroke-width="2"/><text x="473" y="17" text-anchor="middle" class="L">L</text>
  <g transform="translate(488,0)">
    <rect class="dec" x="0" y="0" width="34" height="26"/><text x="17" y="17" text-anchor="middle" class="L">B L</text>
    <rect class="dec" x="38" y="0" width="34" height="26"/><text x="55" y="17" text-anchor="middle" class="L">C L</text>
    <rect class="dec" x="76" y="0" width="34" height="26"/><text x="93" y="17" text-anchor="middle" class="L">D L</text>
    <rect class="dec" x="114" y="0" width="34" height="26"/><text x="131" y="17" text-anchor="middle" class="L">E L</text>
    <rect class="dec" x="152" y="0" width="34" height="26"/><text x="169" y="17" text-anchor="middle" class="L">F L</text>
    <rect class="dec" x="190" y="0" width="34" height="26"/><text x="207" y="17" text-anchor="middle" class="L">G L</text>
    <rect class="dec" x="228" y="0" width="34" height="26"/><text x="245" y="17" text-anchor="middle" class="L">H L</text>
  </g>
  <text x="0" y="44" class="note">orange = prompt token jobs (prefill work), blue = one generated token per user (decode work), L = the job has a listener (it receives logits)</text>
  <text x="488" y="58" class="note">B to H: 7 decode jobs, one each</text>
</g>
<text x="10" y="134" class="t">the class rule, once per forward: every token job has a listener?</text>
<g transform="translate(10,142)">
  <rect class="box" x="0" y="0" width="330" height="40"/>
  <text x="8" y="16" class="mono">n_listeners == token_jobs.size()  ->  8 == 135</text>
  <text x="8" y="32" class="red">false: the whole forward is prompt_or_mixed</text>
</g>
<path class="arrow" d="M340 162 L400 162" marker-end="url(#w3a)"/>
<text x="10" y="212" class="t">where the counters of this forward land</text>
<g transform="translate(10,220)">
  <rect class="bin" x="0" y="0" width="240" height="60"/>
  <text x="8" y="16" class="t">decode_like</text>
  <text x="8" y="34" class="note">nothing from this forward</text>
  <rect class="binP" x="260" y="0" width="330" height="60"/>
  <text x="268" y="16" class="t">prompt_or_mixed</text>
  <text x="268" y="34" class="note">visits and K tokens of all 135 jobs,</text>
  <text x="268" y="48" class="note">the 7 decode jobs included (Wade's point)</text>
</g>
<g transform="translate(410,142)">
  <rect class="box" x="0" y="0" width="440" height="54"/>
  <text x="8" y="16" class="t">runtron: all 8 users start together, so prefill and decode never mix</text>
  <text x="8" y="32" class="note">8 prompt forwards (1,024 jobs, 8 L), then 255 decode forwards (8 jobs, 8 L)</text>
  <text x="8" y="46" class="note">decode_like = exactly the 255 decode forwards</text>
</g>
<text x="10" y="310" class="note">Measured (attnstats-20260924b, prompt 1024, 8 users): decode_like 255 forwards of 8 jobs; prompt_or_mixed 8 forwards of 1,024 jobs.</text>
<text x="10" y="326" class="note">No serving run with the switch on exists, so the real share of mixed forwards is Insufficient data. An estimate (est.) for 8 users and</text>
<text x="10" y="340" class="note">256 generated tokens: 22 % of forwards mixed at prompt 1024, 83 % at prompt 8192.</text>
<text x="10" y="372" class="note">The class is decided on the main thread before the attention workers start (model.hpp:1745-1748). Every counter of the forward is filed under it.</text>
</svg>
