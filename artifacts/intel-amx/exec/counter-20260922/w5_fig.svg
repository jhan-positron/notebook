<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.help{fill:#f3e6d3;stroke:#a8691a}.attn{fill:#e3f0f2;stroke:#0b6e7f}.w0{fill:#0b6e7f;stroke:#0b6e7f}
.note{fill:#5b6770;font-size:11px}.w0t{fill:#ffffff;font-weight:600;font-size:11px}
.arrow{stroke:#b3463b;stroke-width:1.4;fill:none}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3463b"/></marker></defs>
<text x="10" y="18" class="lvl">Pool worker index 0..26 (27 workers, one pinned thread each), two forwards of the same 1-user run</text>
<!-- Forward A -->
<text x="10" y="44" class="t">Forward A: first prompt forward, 7 main helpers, 20 attention workers</text>
<g transform="translate(10,50)">
<rect class="help" x="0" y="0" width="160" height="22"/><text x="80" y="15" text-anchor="middle" class="m">pool 0..6: main helpers</text>
<rect class="w0" x="162" y="0" width="26" height="22"/><text x="175" y="15" text-anchor="middle" class="w0t">7</text>
<rect class="attn" x="190" y="0" width="430" height="22"/><text x="405" y="15" text-anchor="middle" class="m">pool 8..26 = attention workers 1..19</text>
<text x="200" y="36" class="note">dark box = attention worker 0 = pool worker 7</text>
</g>
<!-- Forward B -->
<text x="10" y="120" class="t">Forward B: 1-token decode forward, clamped to 1 main helper, 26 attention workers</text>
<g transform="translate(10,126)">
<rect class="help" x="0" y="0" width="24" height="22"/><text x="12" y="15" text-anchor="middle" class="m">0</text>
<rect class="w0" x="26" y="0" width="26" height="22"/><text x="39" y="15" text-anchor="middle" class="w0t">1</text>
<rect class="attn" x="54" y="0" width="566" height="22"/><text x="337" y="15" text-anchor="middle" class="m">pool 2..26 = attention workers 1..25</text>
<text x="0" y="36" class="note">dark box = attention worker 0 = pool worker 1</text>
</g>
<!-- connector: both dark boxes to the row box on the right -->
<path class="arrow" d="M185 72 L185 100 L660 100"/>
<path class="arrow" d="M49 126 L49 100 L400 100"/>
<path class="arrow" d="M400 100 L660 100" marker-end="url(#ah)"/>
<rect x="662" y="87" width="188" height="26" fill="#ffffff" stroke="#b3463b"/>
<text x="756" y="104" text-anchor="middle" class="t">row [class][worker 0][layer]</text>
<text x="662" y="130" class="note">today: both forwards write</text>
<text x="662" y="144" class="note">row 0, from two different</text>
<text x="662" y="158" class="note">threads and cores</text>
<text x="10" y="192" class="note">Measured: the 1-user runs report active_workers 26 of 27 (the union of indices ever used), the 8-user runs 20.</text>
<text x="10" y="208" class="note">With rows keyed by pool worker, each thread has its own row, and the main-helper rows read zero.</text>
</svg>
