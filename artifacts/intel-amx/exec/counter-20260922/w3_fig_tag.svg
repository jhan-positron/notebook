<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.hoist{fill:#e3f0f2;stroke:#0b6e7f}.new{fill:#e3f0e8;stroke:#2e7d4f}.off{fill:#f3f4f2;stroke:#d8ddd6}
.note{fill:#5b6770;font-size:11px}.good{fill:#2e7d4f;font-weight:600;font-size:12px}
.mono{font-family:IBM Plex Mono, monospace;font-size:11px}.arrow{stroke:#5b6770;stroke-width:1.2;fill:none}
</style>
<defs><marker id="w3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker></defs>
<text x="10" y="18" class="lvl">Option C, the mechanism: one apply_page_range call (one KV head, one page range, one pass)</text>

<rect class="box" x="10" y="34" width="840" height="272"/>
<text x="18" y="52" class="t">hoisted once per call (today)</text>
<rect class="hoist" x="18" y="58" width="400" height="40"/>
<text x="26" y="74" class="mono">stats_enabled = stats_ref.enabled      (the one bool)</text>
<text x="26" y="90" class="mono">path_bits = token_path_span(worker, n)  (per-job bytes)</text>
<rect class="new" x="430" y="58" width="410" height="40"/>
<text x="438" y="74" class="mono">+ job_class = job_class_span(n) (L=with_listener, K=kv_only)</text>
<text x="438" y="90" class="mono">+ visit_tally tallies[2]           (two stack tallies)</text>

<text x="18" y="126" class="t">per visit (one query token x one page x one KV head), inside `if (stats_enabled)`</text>
<rect class="hoist" x="18" y="132" width="400" height="56"/>
<text x="26" y="148" class="mono">path_bits[tok_ix] |= path_bit(visit.served)</text>
<text x="26" y="164" class="mono">stats_tally.record(served, k_tokens)</text>
<text x="26" y="180" class="note">today: one tally for the whole call</text>
<rect class="new" x="430" y="132" width="410" height="56"/>
<text x="438" y="148" class="mono">+ tallies[job_class[tok_ix]].record(served, k_tokens)</text>
<text x="438" y="164" class="note">one byte load (same index as the path bit) and one indexed select:</text>
<text x="438" y="180" class="note">est. 2 to 4 cycles on a visit of est. 5,800 to 11,200 cycles</text>

<text x="18" y="216" class="t">flush, once per call</text>
<rect class="hoist" x="18" y="222" width="400" height="24"/>
<text x="26" y="238" class="mono">add_visits(worker, layer, stats_tally, pass)</text>
<rect class="new" x="430" y="222" width="410" height="24"/>
<text x="438" y="238" class="mono">+ add_visits(worker, layer, tallies, pass)  (adds both)</text>

<text x="18" y="270" class="good">Off state unchanged: the same single test of stats_enabled, no byte load, no extra write.</text>
<text x="18" y="290" class="note">The rows then split by job class (with_listener / kv_only): a new leaf family, and both stderr parsers change.</text>
</svg>
