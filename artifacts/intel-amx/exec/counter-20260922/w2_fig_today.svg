<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
<defs>
<marker id="w2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker>
<marker id="w2aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b6fb6"/></marker>
<marker id="w2aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8691a"/></marker>
<marker id="w2aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6a4c93"/></marker>
</defs>
<style>
.t{fill:#1f2a33}.m{fill:#5b6770}.lvl{font-weight:600;font-size:13px;fill:#1f2a33}
.box{fill:#ffffff;stroke:#d8ddd6}.call{stroke:#5b6770;stroke-width:1.2;fill:none}
.A{fill:#e4ecf7;stroke:#3b6fb6}.B{fill:#f7ecdc;stroke:#a8691a}.C{fill:#ece6f4;stroke:#6a4c93}
.tA{fill:#3b6fb6;font-weight:600}.tB{fill:#a8691a;font-weight:600}.tC{fill:#6a4c93;font-weight:600}
.fA{fill:#3b6fb6}.fB{fill:#a8691a}.fC{fill:#6a4c93}
.lA{stroke:#3b6fb6;stroke-width:1.4;fill:none}.lB{stroke:#a8691a;stroke-width:1.4;fill:none}.lC{stroke:#6a4c93;stroke-width:1.4;fill:none}
.mono{font-family:IBM Plex Mono, monospace;font-size:11px}
.note{fill:#5b6770;font-size:11px}.red{fill:#b3463b;font-weight:600;font-size:12px}
</style>
<text x="10" y="18" class="lvl">Today: one call chain, three writers of the per-forward record (line numbers of 37bb2a4055)</text>

<rect class="box" x="10" y="34" width="470" height="80"/>
<text x="18" y="50" class="t">full_scheduler::forward</text><text x="18" y="64" class="note mono">h/tron/scheduler/full.hpp:1968 onward, writer A at :2090-2102</text>
<rect class="A" x="18" y="70" width="454" height="38"/>
<text x="26" y="86" class="tA">writer A</text><text x="90" y="86" class="t">rdtsc before state.forward, rdtsc after it,</text>
<text x="90" y="101" class="t">note_forward_wall(stop - start)</text>

<path class="call" d="M245 114 L245 138" marker-end="url(#w2a)"/><text x="253" y="130" class="note">state.forward(...) at :2096</text>

<rect class="box" x="10" y="140" width="470" height="58"/>
<text x="18" y="156" class="t">model::state::forward</text><text x="18" y="170" class="note mono">h/tron/models/model.hpp:1639-1683</text>
<text x="18" y="188" class="note">perfetto "forward" slice (:1655), latch guard (:1658), 11 span binds (:1660-1670)</text>

<path class="call" d="M245 198 L245 222" marker-end="url(#w2a)"/><text x="253" y="214" class="note">run_forward at :1682</text>

<rect class="box" x="10" y="224" width="470" height="136"/>
<text x="18" y="240" class="t">run_forward</text><text x="18" y="254" class="note mono">model.hpp:1690-1766</text>
<rect class="B" x="18" y="260" width="454" height="24"/>
<text x="26" y="276" class="tB">writer B</text><text x="90" y="276" class="t">begin_forward (:1745), plugin run, end_forward (:1750)</text>
<rect class="box" x="34" y="290" width="438" height="46"/>
<text x="42" y="305" class="t" font-size="11">plugin_state.run: construct_hw_plan once per minibatch, then every layer</text>
<rect class="C" x="42" y="312" width="422" height="18"/><text x="48" y="325" class="tC" font-size="11">writer C</text><text x="108" y="325" class="t" font-size="11">note_fpga_query (:2735), once per token job with an FPGA pass</text>
<text x="18" y="352" class="note">then logits and listener delivery (:1756-1761), still inside run_forward</text>

<rect class="box" x="600" y="34" width="250" height="176"/>
<text x="608" y="50" class="t">The record: forward_counters</text>
<text x="608" y="64" class="note">one per class, leaf &lt;class&gt;_forwards</text>
<text x="620" y="88" class="mono fA">forwards</text>
<text x="620" y="104" class="mono fA">wall_cycles (T1)</text>
<text x="620" y="120" class="mono fA">wall_max_cycles</text>
<text x="620" y="140" class="mono fC">fpga_queries</text>
<text x="620" y="156" class="mono fB">token_jobs</text>
<text x="620" y="172" class="mono fB">token_jobs_by_path_set[8]</text>
<text x="608" y="200" class="note mono">attn_stats.hpp:247-254</text>

<rect class="box" x="600" y="222" width="250" height="44"/>
<text x="608" y="238" class="t">current_class (which record)</text>
<text x="608" y="254" class="note">stored by writer B, read by A, B and C</text>

<path class="lA" d="M472 88 C540 88 560 100 618 100" marker-end="url(#w2aA)"/>
<path class="lB" d="M472 272 C540 272 560 166 618 164" marker-end="url(#w2aB)"/>
<path class="lC" d="M464 321 C540 321 560 140 618 138" marker-end="url(#w2aC)"/>
<path class="lB" d="M472 266 C540 266 560 244 598 244" marker-end="url(#w2aB)" stroke-dasharray="4 3"/>

<text x="10" y="384" class="red">Writer A picks the record through current_class. Writer B stores current_class later in the chain.</text>
<text x="10" y="400" class="red">Only the call order keeps the two consistent. Nothing in the code checks it.</text>
<text x="10" y="416" class="note">A second caller of model::state::forward, with no full_scheduler around it, would count token_jobs and never forwards.</text>
</svg>
