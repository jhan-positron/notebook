<svg viewBox="0 0 1000 340" width="100%" role="img" aria-labelledby="c1t c1d" style="max-width:1000px;display:block">
<title id="c1t">Decode speed of the 32-user llama-3.1-8b row: nightly CI vs our two arms</title>
<desc id="c1d">Dot plot. Nightly CI 28.25 TPS, our run without AMX kernels 28.25 TPS, our run with AMX kernels 32.21 TPS. Shaded band 31.4 to 34.2 TPS is the pre-registered expectation once AMX ships.</desc>
<rect x="0" y="0" width="1000" height="340" fill="#fcfcfb"/>
<rect x="692.1" y="60" width="207.6" height="200" fill="#fbe9df"/>
<text x="795.9" y="38" text-anchor="middle" font-size="12" fill="#52514e">expected once AMX is in the package</text>
<text x="795.9" y="54" text-anchor="middle" font-size="12" fill="#52514e">+11 to +21 % over 28.25 = 31.4 to 34.2 TPS</text>
<line x1="372.0" y1="60" x2="372.0" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="372.0" y="277" text-anchor="middle" font-size="12" fill="#52514e">27</text>
<line x1="445.5" y1="60" x2="445.5" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="445.5" y="277" text-anchor="middle" font-size="12" fill="#52514e">28</text>
<line x1="519.0" y1="60" x2="519.0" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="519.0" y="277" text-anchor="middle" font-size="12" fill="#52514e">29</text>
<line x1="592.5" y1="60" x2="592.5" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="592.5" y="277" text-anchor="middle" font-size="12" fill="#52514e">30</text>
<line x1="666.0" y1="60" x2="666.0" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="666.0" y="277" text-anchor="middle" font-size="12" fill="#52514e">31</text>
<line x1="739.5" y1="60" x2="739.5" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="739.5" y="277" text-anchor="middle" font-size="12" fill="#52514e">32</text>
<line x1="813.0" y1="60" x2="813.0" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="813.0" y="277" text-anchor="middle" font-size="12" fill="#52514e">33</text>
<line x1="886.5" y1="60" x2="886.5" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="886.5" y="277" text-anchor="middle" font-size="12" fill="#52514e">34</text>
<line x1="960.0" y1="60" x2="960.0" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="960.0" y="277" text-anchor="middle" font-size="12" fill="#52514e">35</text>
<line x1="372" y1="260" x2="960" y2="260" stroke="#c3c2b7" stroke-width="1"/>
<text x="666.0" y="299" text-anchor="middle" font-size="12" fill="#52514e">TPS = generated tokens per second per user (higher is faster)</text>
<text x="358" y="91" text-anchor="end" font-size="14" font-weight="600" fill="#0b0b0b">Nightly CI, 2026-09-22</text>
<text x="358" y="109" text-anchor="end" font-size="11.5" fill="#52514e">package 2026.09.18-3faba6d0, no AMX kernels</text>
<circle cx="464.1" cy="95" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Nightly CI, 2026-09-22: 28.253 TPS (Slack shows 28.3 TPS)</title></circle>
<text x="478.1" y="100" font-size="14" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">28.253 TPS (Slack prints 28.3)</text>
<text x="358" y="156" text-anchor="end" font-size="14" font-weight="600" fill="#0b0b0b">Our run, 2026-09-20, no AMX kernels</text>
<text x="358" y="174" text-anchor="end" font-size="11.5" fill="#52514e">same package file, same binary hash</text>
<circle cx="463.7" cy="160" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Our run, 2026-09-20, no AMX kernels: 28.248 TPS (mean of 3 passes)</title></circle>
<text x="477.7" y="165" font-size="14" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">28.248 TPS</text>
<text x="358" y="221" text-anchor="end" font-size="14" font-weight="600" fill="#0b0b0b">Our run, 2026-09-20, AMX kernels in</text>
<text x="358" y="239" text-anchor="end" font-size="11.5" fill="#52514e">same commit + kernels compiled in</text>
<line x1="463.7" y1="225" x2="754.6" y2="225" stroke="#eb6834" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="463.7" cy="225" r="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"><title>No AMX kernels, same run: 28.25 TPS</title></circle>
<text x="609.2" y="213" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">+14.0 %</text>
<circle cx="754.6" cy="225" r="8" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Our run, 2026-09-20, AMX kernels in: 32.206 TPS (mean of 3 passes)</title></circle>
<text x="768.6" y="230" font-size="14" font-weight="600" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">32.21 TPS</text>
<text x="478.1" y="136" font-size="11.5" fill="#52514e">gap between the two blue dots: +0.02 % (+0.006 TPS)</text>
</svg>