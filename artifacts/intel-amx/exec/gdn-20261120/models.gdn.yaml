# Developer model registry for the gdn-20261120 campaign (passed as -DDEV_MODEL_CONFIG=<this file>).
# It replaces config/models.yaml for the build, so that only the model under study is exported and compiled.
# The entry is a verbatim copy of the qwen_3p5_4b entry of config/models.yaml at tron commit 72e1191804 (PR #3696).
schema_version: 1
models:
  - name: qwen_3p5_4b
    hf_id: Qwen/Qwen3.5-4B
    support_level: cpp_plugin
    notes: "Qwen3.5 decoder with interleaved GatedDeltaNet and full-attention layers."
    ingest:
      hf_id: Qwen/Qwen3.5-4B
      source: generated
      default_weights: positron-ai/Qwen--Qwen3.5-4B-ingest-best-gptq
    variants:
      - slug: ingested-qwen-3.5-4b
        executors: [tp1, tp2, tp4]
        default_weights: positron-ai/Qwen--Qwen3.5-4B-ingest-best-gptq
        tags: [test]
