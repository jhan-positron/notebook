<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 990" role="img"
     aria-labelledby="title description">
  <title id="title">TRON transformer token-generation pipeline for gpt-oss</title>
  <desc id="description">
    A decoder-only transformer pass from token embedding through repeated attention and mixture-of-experts
    layers to logits and next-token sampling. The attention kernel is shown as a replaceable execution
    target: software on the host CPU or Attention on FPGA using Archer and an HBM copy of the KV cache.
  </desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#efede5"/>
    </linearGradient>
    <linearGradient id="attentionBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f4ef"/>
      <stop offset="1" stop-color="#e7f0f7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#13221d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#42514b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#087f63"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6554c0"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17221e; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2.2px; fill: #087f63; }
      .title { font-size: 36px; font-weight: 760; letter-spacing: -.7px; }
      .subtitle { font-size: 15px; fill: #59645f; }
      .lane-title { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
      .step-title { font-size: 17px; font-weight: 760; }
      .step-copy { font-size: 13px; fill: #59645f; }
      .micro { font-size: 12.5px; fill: #6a746f; }
      .chip { font-size: 12px; font-weight: 700; }
      .memory-title { font-size: 14px; font-weight: 800; }
      .memory-copy { font-size: 12.5px; fill: #56615c; }
      .note { font-size: 12px; fill: #6a746f; }
      .flow { fill: none; stroke: #42514b; stroke-width: 2; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #7a8580; stroke-width: 1.6; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .flow-green { fill: none; stroke: #087f63; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .flow-violet { fill: none; stroke: #6554c0; stroke-width: 2.2; marker-end: url(#arrowViolet); }
      .card { fill: #fff; stroke: #cbd0cc; stroke-width: 1.2; }
      .cpu { fill: #f7fbf9; stroke: #82b9a8; }
      .memory { fill: #fffaf0; stroke: #d8b46f; }
      .fpga { fill: #f4f1ff; stroke: #9b8fe0; }
      .result { fill: #f0f5ff; stroke: #87a5d4; }
    </style>
  </defs>

  <rect width="1600" height="990" fill="url(#pageBg)"/>

  <text x="60" y="54" class="eyebrow">TRON RAMP-UP · SHARED BLUEPRINT</text>
  <text x="60" y="96" class="title">One transformer pass. Two attention execution targets.</text>
  <text x="60" y="126" class="subtitle">
    gpt-oss decoder layer structure, abstracted from the supplied Asimov diagram and reconciled with OpenAI’s reference model.
  </text>

  <g aria-label="gpt-oss family facts">
    <rect x="1118" y="40" width="422" height="94" rx="16" fill="#17221e"/>
    <text x="1142" y="66" font-size="12" font-weight="800" letter-spacing="1.2" fill="#b5eadb">GPT-OSS FAMILY</text>
    <text x="1142" y="91" font-size="13" font-weight="700" fill="#ffffff">64 Q heads · 8 KV heads · head dim 64 · hidden 2880</text>
    <text x="1142" y="114" font-size="12" fill="#d2dad6">120b: 36 layers / 128 experts · 20b: 24 layers / 32 experts · top-4</text>
  </g>

  <!-- Lane backgrounds -->
  <rect x="60" y="168" width="1480" height="398" rx="22" fill="#ffffff" stroke="#cbd0cc"/>
  <rect x="60" y="168" width="1480" height="42" rx="22" fill="#17221e"/>
  <rect x="60" y="190" width="1480" height="20" fill="#17221e"/>
  <text x="82" y="195" class="lane-title" fill="#ffffff">WALL-CLOCK → ONE TOKEN, ONE LAYER</text>
  <text x="1517" y="195" text-anchor="end" font-size="12" fill="#b9c4bf">left → right · ? = placement unverified</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="86" y="246" width="128" height="112" rx="14" class="card"/>
  </g>
  <text x="102" y="272" class="micro">COMPUTE · ?</text>
  <text x="102" y="300" class="step-title">Token → x</text>
  <text x="102" y="322" class="step-copy">embedding lookup</text>
  <text x="102" y="341" class="step-copy">residual activation</text>

  <path d="M214 302 H245" class="flow"/>

  <!-- Attention prework -->
  <g filter="url(#shadow)">
    <rect x="246" y="230" width="238" height="145" rx="16" class="cpu"/>
  </g>
  <text x="266" y="258" class="micro">COMPUTE · ?</text>
  <text x="266" y="286" class="step-title">Pre-norm + QKV</text>
  <text x="266" y="310" class="step-copy">RMSNorm(x) → Wqkv</text>
  <text x="266" y="332" class="step-copy">GQA reshape · RoPE(Q,K)</text>
  <rect x="266" y="346" width="88" height="20" rx="10" fill="#d9efe7"/>
  <text x="310" y="360" text-anchor="middle" class="chip" fill="#087f63">Q: 64 × 64</text>
  <rect x="360" y="346" width="104" height="20" rx="10" fill="#fff0cc"/>
  <text x="412" y="360" text-anchor="middle" class="chip" fill="#8d5b00">K,V: 8 × 64</text>

  <path d="M484 302 H520" class="flow-green"/>

  <!-- Replaceable attention kernel -->
  <g filter="url(#shadow)">
    <rect x="520" y="218" width="430" height="170" rx="18" fill="url(#attentionBg)" stroke="#6da998" stroke-width="1.4"/>
  </g>
  <text x="542" y="246" class="micro">REPLACEABLE EXECUTION TARGET</text>
  <text x="542" y="275" class="step-title">Causal GQA attention</text>
  <text x="542" y="299" class="step-copy">QKᵀ / √64 · causal/window mask · learned sink</text>
  <text x="542" y="321" class="step-copy">P = softmax([scores, sink]) · drop sink · output = P · V</text>

  <rect x="542" y="340" width="178" height="34" rx="10" fill="#ffffff" stroke="#63a78f"/>
  <text x="631" y="354" text-anchor="middle" font-size="12" font-weight="800" fill="#087f63">SOFTWARE ATTENTION</text>
  <text x="631" y="368" text-anchor="middle" class="micro">CPU reads host book/page KV</text>

  <rect x="732" y="340" width="196" height="34" rx="10" fill="#f7f4ff" stroke="#8776d4"/>
  <text x="830" y="354" text-anchor="middle" font-size="12" font-weight="800" fill="#6554c0">ATTENTION ON FPGA</text>
  <text x="830" y="368" text-anchor="middle" class="micro">Archer reads shard HBM K/V</text>

  <path d="M950 302 H985" class="flow"/>

  <!-- Attention output -->
  <g filter="url(#shadow)">
    <rect x="986" y="238" width="178" height="128" rx="16" class="result"/>
  </g>
  <text x="1006" y="265" class="micro">COMPUTE · ?</text>
  <text x="1006" y="293" class="step-title">Wo + residual</text>
  <text x="1006" y="317" class="step-copy">project attention output</text>
  <text x="1006" y="339" class="step-copy">x ← x + Wo(attn)</text>

  <path d="M1164 302 H1197" class="flow"/>

  <!-- MoE -->
  <g filter="url(#shadow)">
    <rect x="1198" y="225" width="222" height="156" rx="16" class="cpu"/>
  </g>
  <text x="1218" y="252" class="micro">COMPUTE · ?</text>
  <text x="1218" y="280" class="step-title">Pre-norm + MoE</text>
  <text x="1218" y="304" class="step-copy">RMSNorm → router → top-4</text>
  <text x="1218" y="326" class="step-copy">gated SwiGLU experts</text>
  <text x="1218" y="348" class="step-copy">weighted combine + residual</text>
  <rect x="1218" y="356" width="130" height="18" rx="9" fill="#d9efe7"/>
  <text x="1283" y="369" text-anchor="middle" class="chip" fill="#087f63">x ← x + MoE(x)</text>

  <path d="M1420 302 H1452" class="flow"/>

  <!-- Loop -->
  <g filter="url(#shadow)">
    <rect x="1453" y="246" width="62" height="112" rx="14" fill="#17221e"/>
  </g>
  <text x="1484" y="282" text-anchor="middle" font-size="12" font-weight="800" fill="#b5eadb">NEXT</text>
  <text x="1484" y="303" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">LAYER</text>
  <text x="1484" y="330" text-anchor="middle" font-size="12" fill="#cbd5d0">×24</text>
  <text x="1484" y="345" text-anchor="middle" font-size="12" fill="#cbd5d0">or ×36</text>

  <path d="M1484 358 V424 H365 V381" class="flow-dashed"/>
  <text x="923" y="445" text-anchor="middle" class="note">repeat the same pre-norm attention → residual → pre-norm MoE → residual structure</text>

  <!-- Final head -->
  <path d="M1515 302 H1530 V488 H1180" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="876" y="472" width="304" height="76" rx="15" class="card"/>
  </g>
  <text x="898" y="499" class="micro">AFTER FINAL LAYER</text>
  <text x="898" y="522" class="step-title">RMSNorm → unembedding → logits</text>
  <text x="898" y="542" class="step-copy">sample next token</text>

  <!-- Explicit KV write/read rails -->
  <g filter="url(#shadow)">
    <rect x="246" y="472" width="280" height="76" rx="14" class="memory"/>
  </g>
  <text x="266" y="498" class="micro">AUTHORITATIVE HOST KV</text>
  <text x="266" y="523" class="step-title">book → page → kv_block</text>
  <text x="266" y="541" class="micro">no attention-result write-back</text>
  <path d="M405 375 V470" class="flow-green"/>
  <text x="416" y="437" class="note" fill="#087f63">write new K,V</text>
  <path d="M526 510 H548 V378 H570" class="flow-violet"/>
  <text x="548" y="496" class="note" fill="#6554c0">read historical K,V</text>

  <!-- Memory state strip -->
  <text x="60" y="610" class="eyebrow">DATA MODEL STATE BY MEMORY MODULE</text>

  <g filter="url(#shadow)">
    <rect x="60" y="634" width="472" height="190" rx="18" class="memory"/>
  </g>
  <text x="84" y="665" class="memory-title" fill="#8d5b00">DDR DRAM · host KV authority / working memory</text>
  <text x="84" y="691" class="memory-copy">MODEL WEIGHTS · read-only logically; loader / tier unverified</text>
  <text x="84" y="714" class="memory-copy">KV BOOK · fixed slab; tok_ct / valid prefix advances</text>
  <text x="84" y="737" class="memory-copy">PAGE · 64-token metadata view; owns no K/V payload</text>
  <text x="84" y="760" class="memory-copy">QUERY HEAD / ACTIVATIONS · transient per pass</text>
  <text x="84" y="783" class="memory-copy">AoF: GAL / GOF metadata + disposable packed staging</text>
  <rect x="84" y="797" width="176" height="18" rx="9" fill="#f5dfae"/>
  <text x="172" y="810" text-anchor="middle" class="chip" fill="#7b5000">source of truth for KV</text>

  <path d="M532 728 H572" class="flow-violet"/>
  <text x="552" y="713" text-anchor="middle" class="micro">PCIe</text>
  <text x="552" y="744" text-anchor="middle" class="micro">DMA</text>

  <g filter="url(#shadow)">
    <rect x="574" y="634" width="448" height="190" rx="18" class="fpga"/>
  </g>
  <text x="598" y="665" class="memory-title" fill="#6554c0">FPGA HBM · AoF device copy</text>
  <text x="598" y="691" class="memory-copy">SHARD K/V · packed copy by layer and token range</text>
  <text x="598" y="714" class="memory-copy">MODEL WEIGHTS · FPGA-HBM residency unestablished</text>
  <text x="598" y="737" class="memory-copy">QUERY / RESULT BUFFERS · HBM placement unestablished</text>
  <text x="598" y="760" class="memory-copy">No book/page/GAL/GOF C++ objects cross PCIe</text>
  <text x="598" y="783" class="memory-copy">No KV write-back: the host book remains authoritative</text>
  <rect x="598" y="797" width="224" height="18" rx="9" fill="#ded8fb"/>
  <text x="710" y="810" text-anchor="middle" class="chip" fill="#5141a3">present only when AoF is enabled</text>

  <rect x="574" y="838" width="448" height="52" rx="12" fill="#ffffff" stroke="#9b8fe0" stroke-dasharray="5 4"/>
  <text x="598" y="859" class="memory-title" fill="#6554c0">UNVERIFIED CPU ↔ FPGA BOUNDARY</text>
  <text x="598" y="879" class="memory-copy">Q in · result out · descriptor, buffer tier, direction unknown</text>

  <g filter="url(#shadow)">
    <rect x="1064" y="634" width="476" height="190" rx="18" fill="#f8faf9" stroke="#9ca7a2"/>
  </g>
  <text x="1088" y="665" class="memory-title">Execution boundary · confidence key</text>
  <circle cx="1094" cy="692" r="5" fill="#087f63"/>
  <text x="1108" y="696" class="memory-copy">Known: gpt-oss architecture · OpenAI sources</text>
  <circle cx="1094" cy="719" r="5" fill="#d69b24"/>
  <text x="1108" y="723" class="memory-copy">Inherited: Tron KV facts · prior branch notes</text>
  <circle cx="1094" cy="746" r="5" fill="#6554c0"/>
  <text x="1108" y="750" class="memory-copy">Working boundary: attention moves; adjacent executors unknown</text>
  <text x="1088" y="779" class="memory-copy">Verify active Tron/RTL before treating functions, thresholds,</text>
  <text x="1088" y="799" class="memory-copy">address maps, or timing as implementation contracts.</text>

  <line x1="60" y1="920" x2="1540" y2="920" stroke="#cbd0cc"/>
  <text x="60" y="947" class="note">
    Reference reconciliation: supplied Asimov_transformer_pass.png + Archer_Diagrams-Token_Gen.jpeg; OpenAI gpt-oss model card and reference model.py.
  </text>
  <a xlink:href="https://github.com/openai/gpt-oss/blob/main/gpt_oss/torch/model.py" target="_blank">
    <text x="60" y="969" font-size="12" fill="#087f63" text-decoration="underline">OpenAI reference implementation</text>
  </a>
  <a xlink:href="https://deploymentsafety.openai.com/gpt-oss/full-evaluations" target="_blank">
    <text x="290" y="969" font-size="12" fill="#087f63" text-decoration="underline">gpt-oss model card</text>
  </a>
  <text x="1538" y="969" text-anchor="end" class="note">Conceptual ramp-up artifact · not a timing or RTL specification</text>
</svg>
